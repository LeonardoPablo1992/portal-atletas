<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProTrainerPlus · Head Coach Leonardo Pablo</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#16a34a;--green-d:#15803d;--green-50:#f0fdf4;--green-100:#dcfce7;--green-200:#bbf7d0;
  --ink:#111827;--ink-2:#374151;--muted:#6b7280;--line:#e5e7eb;--line-2:#eef0f2;
  --bg:#f6f8f7;--card:#ffffff;--danger:#ef4444;--warn:#f59e0b;--yt:#ff0033;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 20px 50px -12px rgba(16,24,40,.25);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{flex-shrink:0}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.logo .mark{width:32px;height:32px;border-radius:10px;background:var(--green-50);border:1.5px solid var(--green-200);display:grid;place-items:center;color:var(--green)}
.logo b{color:var(--green)}
.seg{display:flex;background:var(--green-50);border:1px solid var(--green-200);border-radius:999px;padding:3px;margin-left:auto}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;color:var(--green-d);font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.seg button.on{background:var(--green);color:#fff;box-shadow:var(--shadow)}
.top .reset{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;color:var(--muted);font-size:12px}

/* ---------- generic ---------- */
.btn{border:1px solid transparent;border-radius:999px;padding:9px 16px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-d)}
.btn.primary:disabled{background:#e5e7eb;color:#9ca3af;cursor:not-allowed}
.btn.soft{background:var(--green-100);color:var(--green-d)}
.btn.soft:hover{background:var(--green-200)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--green);color:var(--green-d)}
.btn.outline{background:#fff;border-color:var(--ink);color:var(--ink)}
.btn.yt{background:#fff;border-color:#fecdd3;color:#e11d48}
.btn.yt:hover{background:#fff1f2}
.btn.danger{background:#fff;border-color:#fecaca;color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.full{width:100%;justify-content:center}
.icon-btn{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-2);position:relative}
.icon-btn:hover{border-color:var(--green);color:var(--green)}
.badge-dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid}
.pill.done{color:var(--green-d);background:var(--green-50);border-color:var(--green-200)}
.pill.pending{color:#92400e;background:#fffbeb;border-color:#fde68a}
.pill.missed{color:#b91c1c;background:#fef2f2;border-color:#fecaca}
.pill.partial{color:#1d4ed8;background:#eff6ff;border-color:#bfdbfe}
.avatar{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field small{color:var(--muted);font-size:11px}
.inp,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;outline:none;width:100%;transition:.15s}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-100)}
.field textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.inrow{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.inrow:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--green-100)}
.inrow .pre{padding:0 10px;color:var(--yt);display:flex}
.inrow input{border:0!important;box-shadow:none!important;padding-left:0}
.info{display:flex;gap:8px;align-items:center;background:#dbeafe;color:#1e3a8a;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.empty-state{padding:28px;text-align:center;color:var(--muted)}

/* ---------- layouts ---------- */
#app{min-height:calc(100vh - 57px)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:0;height:calc(100vh - 57px)}
.split>.pane{overflow:auto}
.split>.pane.ath-pane{background:#e9efec;border-left:1px solid var(--line);padding:18px}
.single-ath{padding:20px;display:flex;justify-content:center}

/* ---------- coach ---------- */
.coach{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.side{background:#fff;border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
.side-h{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.side-h .count{background:var(--green-100);color:var(--green-d);border-radius:999px;padding:2px 9px;font-size:12px}
.ath-item{display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.ath-item:hover{background:var(--bg)}
.ath-item.on{background:var(--green-50);border-color:var(--green-200)}
.ath-item .nm{font-weight:600;font-size:13px}
.ath-item .sub{font-size:11px;color:var(--muted)}
.ath-item .bar{height:4px;background:var(--line);border-radius:4px;margin-top:5px;overflow:hidden}
.ath-item .bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.main{padding:18px 22px 40px;min-width:0}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.crumbs b{color:var(--green-d);font-weight:600}
.ath-select{display:none;margin-bottom:12px}
.cl-head{display:flex;align-items:center;gap:14px;padding:16px;flex-wrap:wrap}
.cl-head .avatar{width:52px;height:52px;font-size:18px}
.cl-head h2{margin:0;font-size:19px;letter-spacing:-.01em}
.cl-head .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}
.kpi{padding:14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tabs button.on{color:var(--green-d);border-color:var(--green)}
.tabs .n{background:var(--danger);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px}

/* calendar */
.cal-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cal-h h3{margin:0 6px;font-size:16px;text-transform:capitalize;min-width:150px}
.cal-h .legend{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.cal-h .legend span{display:flex;align-items:center;gap:4px}
.cal-h .legend i{width:8px;height:8px;border-radius:9px;display:inline-block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{padding:8px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.cell{min-height:112px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:6px;position:relative;cursor:pointer;transition:background .12s}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:#fafcfb}
.cell.out{background:#fbfbfb;cursor:default}
.cell .dn{font-size:12px;font-weight:600;color:var(--ink-2);width:24px;height:24px;display:grid;place-items:center;border-radius:99px;margin-bottom:4px}
.cell.today .dn{background:var(--green);color:#fff}
.cell.past .dn{color:#9ca3af}
.cell .add{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:99px;border:0;background:var(--green-100);color:var(--green-d);display:none;place-items:center;font-weight:700}
.cell:hover .add{display:grid}
.chip{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 6px;border-radius:7px;background:color-mix(in srgb,var(--c) 12%,#fff);border-left:3px solid var(--c);margin-bottom:3px;white-space:nowrap;overflow:hidden;color:var(--ink-2)}
.chip span{overflow:hidden;text-overflow:ellipsis;flex:1}
.chip:hover{filter:brightness(.96)}
.chip.done span{text-decoration:line-through;color:var(--muted)}
.chip .st{flex-shrink:0;display:flex}
.chip.done .st{color:var(--green)}
.chip.missed .st{color:var(--danger)}
.more{font-size:11px;color:var(--green-d);font-weight:600;padding-left:4px}
.cell.sel{outline:2px solid var(--green);outline-offset:-2px;background:var(--green-50)}

/* compact (split / mobile) */
.coach.compact{grid-template-columns:1fr}
.coach.compact .side{display:none}
.coach.compact .ath-select{display:flex}
.coach.compact .cell{min-height:84px}
.coach.compact .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){
  .coach{grid-template-columns:1fr}.side{display:none}.ath-select{display:flex}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cell{min-height:70px;padding:4px}.chip span{display:none}.chip{padding:3px;justify-content:center}
  .split{grid-template-columns:1fr;height:auto}.split>.pane.ath-pane{border-left:0;border-top:1px solid var(--line)}
  .seg button .lbl{display:none}
  .logo .txt{display:none}
  .main{padding:14px 16px 30px}
  .cal-h .legend{display:none}
}

/* activity / feed */
.feed-item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2);align-items:flex-start}
.feed-item:last-child{border-bottom:0}
.feed-item .fi{width:32px;height:32px;border-radius:99px;display:grid;place-items:center;flex-shrink:0}
.feed-item .ft{font-size:13px}
.feed-item .fm{font-size:11px;color:var(--muted);margin-top:2px}
.feed-item.unread{background:var(--green-50)}

/* chat */
.chat{display:flex;flex-direction:column;height:460px}
.chat-list{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:#fafbfa}
.msg{max-width:78%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.45;position:relative}
.msg .t{font-size:10px;opacity:.7;margin-top:3px}
.msg.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .sch{font-size:10px;font-weight:600;display:inline-flex;gap:4px;align-items:center;margin-bottom:3px;opacity:.85}
.chat-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#fff;border-radius:0 0 var(--r) var(--r)}
.chat-in input{flex:1;border:1px solid var(--line);border-radius:999px;padding:9px 14px;outline:none}
.chat-in input:focus{border-color:var(--green)}

/* evolution */
.evo-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:16px}
.evo-stats .s{background:var(--bg);border-radius:12px;padding:12px}
.evo-stats .s .l{font-size:11px;color:var(--muted)}
.evo-stats .s .v{font-size:20px;font-weight:800}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:8px 16px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
.tbl td{padding:9px 16px;border-bottom:1px solid var(--line-2)}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.45);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .15s}
.ov.video{z-index:70;background:rgba(0,0,0,.8)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.modal{background:#fff;border-radius:18px;width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .18s}
.modal.sm{width:min(480px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 20px 12px}
.modal-h h3{margin:0;font-size:18px;flex:1;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.modal-h .x{border:0;background:transparent;color:var(--ink-2);padding:4px;display:flex}
.modal-b{padding:4px 20px 20px;overflow:auto}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}

/* accordion (task types) */
.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff;overflow:hidden;box-shadow:var(--shadow)}
.acc-h{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;font-weight:500}
.acc-h:hover{background:#fafafa}
.acc-h .dot{width:11px;height:11px;border-radius:99px;background:var(--c)}
.acc-h .tic{color:var(--c);display:flex}
.acc-h .chev{margin-left:auto;transition:.2s;color:var(--ink-2)}
.acc.open .chev{transform:rotate(180deg)}
.acc.open .acc-h{border-bottom:1px solid var(--line)}
.acc-b{padding:14px}
.acc-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.new-tag{font-size:10px;font-weight:700;background:#fff1f2;color:#e11d48;border-radius:6px;padding:2px 6px}
.ai-tag{width:18px;height:18px;border-radius:5px;background:#7c3aed;color:#fff;display:grid;place-items:center;font-size:11px}

/* builder */
.tpls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tpls span{font-size:12px;color:var(--muted);margin-right:4px}
.blk{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.blk-h{display:flex;gap:8px;align-items:center;background:#9aa3ab;padding:8px 10px}
.blk-h input{background:transparent;border:0;color:#fff;font-weight:600;flex:1;outline:none;font-size:14px}
.blk-h input::placeholder{color:#eef}
.blk-h button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:4px 8px;font-size:12px}
.ex{display:grid;grid-template-columns:22px minmax(120px,2fr) 62px 74px 70px minmax(120px,1.6fr) 28px;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line-2)}
.ex .num{font-size:12px;color:var(--muted);font-weight:600}
.ex input{border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:12px;outline:none;width:100%}
.ex input:focus{border-color:var(--green)}
.ex input.yt-in{border-color:#fecdd3;background:#fff8f9}
.ex .del{border:0;background:transparent;color:#9ca3af;display:flex}
.ex .del:hover{color:var(--danger)}
.ex-head{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.blk-f{padding:8px 10px}
.blk-f button{border:0;background:transparent;color:var(--green-d);font-weight:600;font-size:12px}
.attach-bar{border:1px dashed var(--green-200);background:var(--green-50);border-radius:12px;padding:12px;margin:12px 0}
.attach-bar .lbl{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.ico-chips{display:flex;flex-wrap:wrap;gap:6px}
.ico-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:500}
.ico-chip i{width:9px;height:9px;border-radius:9px;background:var(--c)}
.ico-chip:hover{border-color:var(--c)}
.att{display:grid;grid-template-columns:30px minmax(100px,1fr) minmax(140px,1.6fr) 28px;gap:6px;align-items:center;margin-top:8px}
.att .ai{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--c)}
.att input,.att select{border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:12px;width:100%;outline:none;background:#fff}
@media (max-width:640px){
  .ex{grid-template-columns:22px 1fr 54px 64px 28px}
  .ex .rest,.ex .ytw{grid-column:2/5}
  .ex-head{display:none}
}

/* yt preview */
.ytprev{border-radius:12px;overflow:hidden;position:relative;background:#111;aspect-ratio:16/9;display:grid;place-items:center;color:#9ca3af;font-size:13px}
.ytprev.empty{background:var(--bg);border:1px dashed var(--line);aspect-ratio:auto;padding:26px}
.ytprev img{width:100%;height:100%;object-fit:cover;display:block}
.ytprev .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent,rgba(0,0,0,.35));border:0;color:#fff}
.ytprev .play span{width:64px;height:44px;border-radius:12px;background:var(--yt);display:grid;place-items:center}
.video-box{width:min(960px,100%)}
.video-box .vh{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:10px}
.video-box .vh h4{margin:0;flex:1;font-size:15px}
.video-box .frame{aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.video-box iframe{width:100%;height:100%;border:0;display:block}
.video-box .vf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:#cbd5e1;font-size:12px;gap:10px;flex-wrap:wrap}
.video-box a{color:#fff}

/* session detail (coach + athlete) */
.stats{display:flex;flex-wrap:wrap;gap:18px;padding:12px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px;font-size:14px;font-weight:600}
.stats span{display:flex;align-items:center;gap:6px}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:transparent;padding:0;color:#d1d5db;font-size:20px;line-height:1}
.stars button.on,.stars .on{color:#f59e0b}
.stars i{font-style:normal;color:#d1d5db;font-size:16px}
.blk-v{background:#9aa3ab;color:#fff;font-weight:600;padding:9px 12px;border-radius:8px;margin:14px 0 8px}
details.exv{border-bottom:1px solid var(--line-2)}
details.exv summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 4px;cursor:pointer}
details.exv summary::-webkit-details-marker{display:none}
details.exv summary .n{width:24px;height:24px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font-size:12px;color:var(--muted);font-weight:600}
details.exv summary .nm{flex:1;font-weight:600}
details.exv summary .chev{transition:.2s;color:var(--muted)}
details.exv[open] summary .chev{transform:rotate(180deg)}
.exv-b{padding:4px 4px 12px 38px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.setpills{display:flex;gap:6px;flex-wrap:wrap}
.setp{min-width:58px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--ink-2);display:inline-flex;gap:5px;align-items:center;justify-content:center}
.setp.on{background:var(--green);border-color:var(--green);color:#fff}
.setp:disabled{cursor:default}
.vbtn{border:0;background:#fff1f2;color:#e11d48;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.vbtn:hover{background:#ffe4e6}
.note{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2);line-height:1.5;white-space:pre-wrap}
.att-pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.att-pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--ink-2)}
.att-pill .d{width:8px;height:8px;border-radius:9px;background:var(--c)}
.att-pill:hover{border-color:var(--c)}
.finish{background:var(--green-50);border:1px solid var(--green-200);border-radius:14px;padding:14px;margin-top:16px}
.finish h4{margin:0 0 10px}
.range-row{display:flex;align-items:center;gap:10px}
.range-row input{flex:1;accent-color:var(--green)}
.range-row b{width:44px;text-align:right}
.timer{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:700;background:#111827;color:#fff;border-radius:999px;padding:7px 14px}
.timer .pulse{width:8px;height:8px;border-radius:9px;background:#22c55e;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
.qa{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.qa .q{font-size:12px;color:var(--muted);margin-bottom:4px}
.scale{display:flex;gap:6px}
.scale button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 0;font-weight:600}
.scale button.on{background:var(--green);border-color:var(--green);color:#fff}

/* ---------- athlete (phone) ---------- */
.phone{width:100%;max-width:400px;background:#fff;border-radius:28px;box-shadow:var(--shadow-lg);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;min-height:760px}
.single-ath .phone{max-width:440px}
.ph-top{background:linear-gradient(160deg,#16a34a,#0f7a37);color:#fff;padding:18px 18px 20px;position:relative}
.ph-top .r1{display:flex;align-items:center;gap:10px}
.ph-top .hi{font-size:12px;opacity:.85}
.ph-top h3{margin:0;font-size:19px;letter-spacing:-.01em}
.ph-top .icon-btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25);color:#fff;margin-left:auto}
.ph-top .as{margin-top:12px;display:flex;gap:8px;align-items:center;font-size:11px;opacity:.95}
.ph-top .as select{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px}
.ph-top .as select option{color:#111}
.today-sum{display:flex;align-items:center;gap:14px;margin-top:14px;background:rgba(255,255,255,.12);border-radius:16px;padding:12px}
.ring{width:54px;height:54px;flex-shrink:0}
.today-sum .tx{font-size:12px;opacity:.9}
.today-sum .tx b{display:block;font-size:15px;opacity:1}
.ph-tabs{display:flex;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:2}
.ph-tabs button{flex:1;border:0;background:transparent;padding:11px 4px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.ph-tabs button.on{color:var(--green-d);border-color:var(--green)}
.ph-tabs .n{position:absolute;top:5px;right:calc(50% - 20px);background:var(--danger);color:#fff;border-radius:99px;font-size:9px;padding:1px 5px}
.ph-body{padding:14px;flex:1;background:#fafbfa}
.week{display:grid;grid-template-columns:24px repeat(7,1fr) 24px;gap:4px;align-items:center;margin-bottom:14px}
.week .nav{border:0;background:transparent;color:var(--muted);font-size:18px;padding:0}
.wd{border:1px solid var(--line);background:#fff;border-radius:14px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.wd .a{font-size:10px;color:var(--muted);text-transform:uppercase}
.wd .b{font-size:15px;font-weight:700}
.wd .dots{display:flex;gap:2px;height:6px}
.wd .dots i{width:5px;height:5px;border-radius:5px;background:var(--c)}
.wd.today .b{color:var(--green)}
.wd.on{background:var(--green);border-color:var(--green);color:#fff}
.wd.on .a,.wd.on .b{color:#fff}
.wd.on .dots i{background:#fff!important}
.day-title{font-size:13px;font-weight:700;margin:4px 2px 10px;text-transform:capitalize;display:flex;justify-content:space-between;align-items:center}
.tcard{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:9px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.tcard:hover{border-color:var(--c);transform:translateY(-1px);box-shadow:var(--shadow)}
.tcard .ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);flex-shrink:0}
.tcard .tb{flex:1;min-width:0}
.tcard .tt{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--c)}
.tcard .tn{font-weight:600;font-size:14px;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .tm{font-size:11px;color:var(--muted)}
.tcard.done{opacity:.75}
.tcard .thumb{width:72px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0}
.mini-cal .cell{min-height:52px;padding:3px;text-align:center}
.mini-cal .cell .dn{margin:0 auto 2px}
.mini-cal .mdots{display:flex;gap:2px;justify-content:center;flex-wrap:wrap}
.mini-cal .mdots i{width:6px;height:6px;border-radius:6px;background:var(--c)}
.mini-cal .dow{text-align:center;padding:6px 0}
.ph-body .chat{height:520px}

/* toast */
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#111827;color:#fff;border-radius:999px;padding:10px 16px;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow-lg);animation:pop .2s}
.toast .ok{color:#4ade80;display:flex}
.flash{animation:flash 1.2s}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(22,163,74,.6)}100%{box-shadow:0 0 0 14px rgba(22,163,74,0)}}

.video-box video{width:100%;height:100%;display:block;background:#000}
.secnav{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.secnav .sn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;color:var(--ink-2);display:inline-flex;gap:7px;align-items:center}
.secnav .sn.on{background:var(--green-50);border-color:var(--green);color:var(--green-d)}
.secnav .sn small{background:var(--green-100);color:var(--green-d);border-radius:99px;padding:1px 7px;font-size:11px}
.secnav .sp{flex:1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar .inp{width:auto;flex:1;min-width:150px}
.toolbar select.inp{flex:0 1 auto}
.src-banner{display:flex;gap:10px;align-items:center;background:var(--green-50);border:1px solid var(--green-200);color:var(--green-d);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px}
.gtag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.ttag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:#eef2ff;color:#4338ca;white-space:nowrap}
.vchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#e11d48;background:#fff1f2;border:0;border-radius:999px;padding:4px 10px;white-space:nowrap}
.vchip.none{color:var(--muted);background:var(--bg)}
.row-acts{display:flex;gap:4px;justify-content:flex-end}
.mini-btn{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;display:grid;place-items:center;color:var(--ink-2)}
.mini-btn:hover{border-color:var(--green);color:var(--green)}
.plans-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.plan-card{padding:16px;display:flex;flex-direction:column;gap:10px}
.plan-card h4{margin:0;font-size:15px}
.plan-card .days{display:flex;flex-wrap:wrap;gap:5px}
.plan-card .acts{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.plan-new{border:2px dashed var(--green-200);background:var(--green-50);display:grid;place-items:center;min-height:180px;cursor:pointer;color:var(--green-d);font-weight:600;border-radius:var(--r)}
.plan-new:hover{border-color:var(--green)}
.modal.xl{width:min(1200px,100%);height:92vh}
.daytabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:10px;align-items:center}
.daytab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:600;font-size:12px;color:var(--ink-2)}
.daytab.on{background:var(--green);color:#fff;border-color:var(--green)}
.ptbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;min-width:1020px}
.ptbl th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptbl th.ph{text-align:center;background:var(--green-50);color:var(--green-d)}
.ptbl td{padding:5px 4px;border-bottom:1px solid var(--line-2)}
.ptbl input,.ptbl select{border:1px solid var(--line);border-radius:7px;padding:6px;font-size:12px;width:100%;outline:none;background:#fff}
.ptbl input:focus,.ptbl select:focus{border-color:var(--green)}
.ptbl .sr{display:flex;gap:2px;align-items:center;justify-content:center}
.ptbl .sr input{width:34px;text-align:center;padding:6px 2px}
.ptbl .sr span{color:var(--muted)}
.ptbl td.phc{background:#fafdfb}
.ptbl select{min-width:170px}
.scroll-x{overflow-x:auto}
.vprev{border:0;background:#fff1f2;color:#e11d48;border-radius:7px;width:28px;height:28px;display:grid;place-items:center;flex-shrink:0}
.vwrap{display:flex;gap:4px;align-items:center}
.vframe{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;width:100%}
.vframe iframe,.vframe video{width:100%;height:100%;border:0;display:block}
.vthumb{display:grid;place-items:center;background:linear-gradient(135deg,#1f2937,#111827);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tile{padding:14px}
.tile .l{font-size:12px;color:var(--muted);display:flex;gap:5px;align-items:center}
.tile .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.tile .v small{font-size:12px;color:var(--muted);font-weight:500}
.tile .s{font-size:11px;color:var(--muted);margin-top:4px}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.status.under{background:#eff6ff;color:#1d4ed8}
.status.ok{background:#dcfce7;color:#15803d}
.status.warn{background:#fef3c7;color:#b45309}
.status.risk{background:#fee2e2;color:#b91c1c}
.status.none{background:var(--bg);color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:12px;margin-bottom:12px}
.chart-card{padding:14px 14px 8px}
.chart-card h4{margin:0;font-size:14px}
.chart-card .sub{font-size:11px;color:var(--muted);margin:2px 0 8px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .bar{fill:var(--green);transition:opacity .12s}
.chart .bar.cur{fill:var(--green-d)}
.chart g[data-tip]:hover .bar{opacity:.72}
.chart .axis{font-size:10px;fill:#6b7280}
.chart .grid{stroke:#eef0f2}
.chart .val{font-size:10px;font-weight:700;fill:#374151}
.ctip{position:fixed;z-index:95;pointer-events:none;background:#111827;color:#fff;font-size:12px;border-radius:8px;padding:7px 10px;box-shadow:var(--shadow-lg);max-width:250px;line-height:1.4;display:none}
.how summary{cursor:pointer;font-weight:600;color:var(--green-d);display:flex;gap:6px;align-items:center;list-style:none}
.how .f{font-family:ui-monospace,Menlo,monospace;background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0 10px;font-size:12px}
.zones{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.zones label{font-size:10px;color:var(--muted);text-align:center;display:block;margin-bottom:3px}
.zones input{text-align:center;padding:7px 4px}
.calc{background:#fff;border:1px dashed var(--green);border-radius:10px;padding:8px 12px;font-size:13px;margin:0 0 12px}
.calc b{color:var(--green-d)}
.kg{width:80px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;text-align:center;outline:none}
.kg:focus{border-color:var(--green)}

.qm{width:18px;height:18px;border-radius:99px;border:1.5px solid currentColor;background:transparent;color:var(--muted);font-size:11px;font-weight:800;display:inline-grid;place-items:center;padding:0;line-height:1;vertical-align:middle;margin-left:5px;flex-shrink:0;cursor:pointer}
.qm:hover{color:var(--green)}
.ph-top .qm{color:rgba(255,255,255,.9)}
.pop{position:fixed;z-index:97;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px 14px;font-size:13px;line-height:1.5;color:var(--ink-2);animation:pop .15s;max-height:70vh;overflow:auto}
.pop h5{margin:0 0 4px;font-size:13px;color:var(--ink)}
.pop .f{font-family:ui-monospace,Menlo,monospace;background:var(--bg);border-radius:6px;padding:6px 8px;margin:6px 0;font-size:12px;color:var(--ink);white-space:pre-wrap}
.scale10{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale10 button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 0;font-weight:700;font-size:13px;color:var(--ink-2)}
.scale10 button:hover{border-color:var(--green)}
.scale10 button.on{background:var(--green);border-color:var(--green);color:#fff}
.scale-ends{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:3px}
.men{display:flex;align-items:center;gap:10px;border:1.5px dashed #fda4af;border-radius:12px;padding:10px 12px;background:#fff;cursor:pointer;color:var(--ink-2);font-size:13px}
.men .ico{width:36px;height:36px;border-radius:99px;display:grid;place-items:center;background:#fff1f2;color:#e11d48;flex-shrink:0}
.men.on{background:#fff1f2;border-style:solid;border-color:#e11d48}
.men.on .ico{background:#e11d48;color:#fff}
.ivid{position:relative;cursor:pointer;max-width:460px}
.ivid img{width:100%;height:100%;object-fit:cover;display:block}
.ivid .pl{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent 40%,rgba(0,0,0,.45))}
.ivid .pl span{width:58px;height:40px;border-radius:12px;background:#e11d48;color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ivid:hover .pl span{transform:scale(1.06)}
.ivid .cap{position:absolute;left:12px;right:12px;bottom:9px;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ex-vp{padding:0 10px 10px 38px}
.ex-vp:empty{display:none}
.ex-vp .ivid{max-width:280px}
.lthumb{width:92px;aspect-ratio:16/9;border-radius:6px;object-fit:cover;display:block;cursor:pointer;background:#111}
.prof{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px;margin-bottom:12px}
.calc-card{padding:14px 16px;font-size:13px;line-height:1.5;color:var(--ink-2)}
.calc-card h4{margin:0 0 6px;font-size:14px;color:var(--ink)}
.calc-card .f{font-family:ui-monospace,Menlo,monospace;background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:12px;color:var(--ink);white-space:pre-wrap;overflow-x:auto}
.sec-h{font-size:16px;font-weight:800;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.readi{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.pink{background:#fff1f2!important;color:#e11d48!important}

.ph-tabs button{font-size:11px;padding:10px 2px;min-width:0}
.tl-dot{display:inline-block;border-radius:99px;flex-shrink:0;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.07);cursor:help}
.tl-light{display:flex;flex-direction:column;gap:6px;background:#1f2937;border-radius:16px;padding:8px;flex-shrink:0}
.tl-light i{width:24px;height:24px;border-radius:99px;opacity:.18;display:block}
.tl-light i.red{background:#ef4444;color:#ef4444}.tl-light i.yellow{background:#f59e0b;color:#f59e0b}.tl-light i.green{background:#22c55e;color:#22c55e}
.tl-light i.on{opacity:1;box-shadow:0 0 14px 2px currentColor}
.tl-card{padding:16px;margin-bottom:12px}
.tl-top{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.tl-title{font-size:19px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.tl-title.green{color:#15803d}.tl-title.yellow{color:#b45309}.tl-title.red{color:#b91c1c}.tl-title.none{color:var(--muted)}
.tl-factors{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tlf{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink-2);cursor:help}
.tlf.p0{background:var(--green-50);border-color:var(--green-200);color:var(--green-d)}
.tlf.p1{background:#fffbeb;border-color:#fde68a;color:#92400e}
.tlf.p2{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.tl-grid{display:grid;grid-template-columns:auto repeat(7,22px);gap:5px 4px;align-items:center;font-size:10px;color:var(--muted)}
.tl-h{text-align:center}.tl-wk{padding-right:6px;white-space:nowrap}
.tl-cell{display:grid;place-items:center;height:20px}
.tl-cell.fut::after{content:"";width:6px;height:6px;border-radius:9px;background:var(--line)}
.tl-strip{display:grid;grid-template-columns:repeat(14,1fr);gap:2px;text-align:center}
.tl-strip div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;color:var(--muted)}
.tl-cal{position:absolute;top:13px;left:34px;display:flex}
.lib-empty{padding:26px 16px;text-align:center;color:var(--muted)}
.lib-empty .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.lib-more{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:12px;color:var(--muted)}
.tile .s .status{white-space:normal}

.wprog{position:sticky;top:-4px;z-index:3;background:#fff;padding:10px 0 14px;margin:0 0 8px;border-bottom:1px solid var(--line)}
.wprog .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}
.wprog .r1 b{color:var(--green-d);font-size:16px;font-weight:800}
.wprog .msg{color:var(--ink-2);font-weight:600}
.wprog .track{position:relative;height:12px;border-radius:99px;background:var(--green-50);border:1px solid var(--green-200);margin:0 22px 0 14px}
.wprog .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#86efac,#16a34a);transition:width .7s cubic-bezier(.3,1.3,.5,1)}
.wprog .tick{position:absolute;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:9px;background:var(--green-200)}
.wprog .tick.on{background:#fff}
.wprog .head{position:absolute;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:99px;background:#fff;border:2.5px solid var(--green);color:var(--green);display:grid;place-items:center;box-shadow:0 4px 12px rgba(22,163,74,.25);transition:left .7s cubic-bezier(.3,1.3,.5,1)}
.wprog .head.bump{animation:bump .5s}
.wprog .goal{position:absolute;right:-22px;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:99px;background:#f3f4f6;color:#9ca3af;display:grid;place-items:center;border:2px solid #fff;box-shadow:var(--shadow)}
.wprog .goal.won{background:#fef3c7;color:#d97706;animation:bump .7s}
.wprog.done .head{opacity:0}

function vInfo(url){
  if(!url) return null;url=String(url).trim();
  if(typeof PURGE_V!=='undefined'&&PURGE_V.some(id=>url.includes(id))) return null;
  let m=url.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/);
  if(m) return {kind:'a',embed:`https://www.youtube-nocookie.com/embed/${m[1]}?rel=0&modestbranding=1`,thumb:`https://img.youtube.com/vi/${m[1]}/hqdefault.jpg`,open:`https://www.youtube.com/watch?v=${m[1]}`};
  m=url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m) return {kind:'b',embed:`https://player.vimeo.com/video/${m[1]}`,thumb:null,open:`https://vimeo.com/${m[1]}`};
  m=url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if(m) return {kind:'c',embed:`https://drive.google.com/file/d/${m[1]}/preview`,thumb:null,open:url};
  if(/^https?:\/\/\S+\.(mp4|webm|mov|m4v)(\?\S*)?$/i.test(url)) return {kind:'file',embed:url,thumb:null,open:url};
  return null;
}

    if(n.meals_by_day){const NAMES={desayuno:'Desayuno',almuerzo:'Almuerzo',colacion:'Colación',colacion1:'Colación',colacion2:'Colación',comida:'Comida',merienda:'Merienda',cena:'Cena'};
      out.menus=Object.values(n.meals_by_day).map((d,i)=>({name:`Menú ${d.dia||i+1}`,meals:Object.entries(d).filter(([k,v])=>v&&typeof v==='object'&&!Array.isArray(v)).map(([k,v])=>meal('',`${NAMES[k]||k[0].toUpperCase()+k.slice(1)}${v.titulo?' · '+v.titulo:''}`,v.items||[],null,'',''))}));}

/* Lee el entrenamiento de los planes HTML actuales (6 formatos) y lo convierte al formato de plan de la v2 */
function grabLit(t,marker){
  let i=-1;const re=new RegExp('(?:const|let|var)\\s+'+marker+'\\s*=','g');const m=re.exec(t);if(!m)return null;i=m.index+m[0].length;
  let j=i;while(/\s/.test(t[j]))j++;const open=t[j];if(open!=='{'&&open!=='[')return null;const close=open==='{'?'}':']';
  let d=0,q=null;
  for(let k=j;k<t.length;k++){const c=t[k];
    if(q){if(c==='\\'){k++;continue}if(c===q)q=null;continue}
    if(c==='"'||c==="'"||c==='`'){q=c;continue}
    if(c==='/'&&t[k+1]==='/'){const n=t.indexOf('\n',k);if(n<0)break;k=n;continue}
    if(c==='/'&&t[k+1]==='*'){const n=t.indexOf('*/',k+2);if(n<0)break;k=n+1;continue}
    if(c===open)d++;else if(c===close&&!--d){try{return Function('"use strict";return ('+t.slice(j,k+1)+')')()}catch(e){return null}}
  }
  return null;
}
function parseOldPlan(html){

      days=Object.entries((m&&m.days)||{}).map(([k,d])=>({name:k,rows:((d&&d.exercises)||[]).filter(r=>r&&(r.ejercicio||r.name)).map(r=>row(r.ejercicio||r.name,r.categoria||r.cat,same(ph1(r.series??r.sets,r.reps)),r.tempo,r.rir,r.rest))}));}

function calHTML(role){
  const key=role==='coach'?'month':'athMonth', aid=S.ui.athleteId;
  const [y,m]=S.ui[key].split('-').map(Number);
  const first=new Date(y,m-1,1), off=(first.getDay()+6)%7, days=new Date(y,m,0).getDate();
  const cells=Math.ceil((off+days)/7)*7, tctx=role==='coach'?tlCtx(aid):null;
  let h=`<div class="cal-h">
    <button class="icon-btn" onclick="shiftMonth('${key}',-1)">‹</button>
    <button class="icon-btn" onclick="shiftMonth('${key}',1)">›</button>
    <h3>${MES[m-1]} ${y}</h3>
    <button class="btn soft sm" onclick="S.ui['${key}']=TODAY.slice(0,7);commit()">Hoy</button>
    ${role==='coach'?`<div class="legend">${['entrenamiento','video','nutricion','evolucion','formulario'].map(k=>`<span><i style="background:${TYPES[k].color}"></i>${TYPES[k].label}</span>`).join('')}</div>`:''}
  </div><div class="cal ${role==='athlete'?'mini-cal':''}">`;
  DIAS.forEach(d=>h+=`<div class="dow">${role==='athlete'?d[0]:d}</div>`);
  for(let i=0;i<cells;i++){
    const dn=i-off+1;
    if(dn<1||dn>days){h+='<div class="cell out"></div>';continue}
    const ds=`${y}-${pad(m)}-${pad(dn)}`, ts=tasksOn(aid,ds);
    const cls=`cell ${ds===TODAY?'today':''} ${ds<TODAY?'past':''} ${role==='athlete'&&ds===S.ui.selDay?'sel':''}`;
    if(role==='coach'){
      h+=`<div class="${cls}" onclick="openAddTask('${ds}')"><div class="dn">${dn}</div>${tctx&&ds<=TODAY?`<span class="tl-cal">${tlDot(trafficDay(tctx,ds),9,ds)}</span>`:''}<button class="add" onclick="event.stopPropagation();openAddTask('${ds}')">+</button>`;
      ts.slice(0,3).forEach(t=>{const st=status(t);h+=`<div class="chip ${st}" style="--c:${TYPES[t.type].color}" onclick="event.stopPropagation();openCoachTask('${t.id}')" title="${esc(t.title)}"><span>${esc(t.title)}</span><b class="st">${st==='done'?ic('check',12):st==='missed'?ic('x',12):''}</b></div>`});
      if(ts.length>3) h+=`<div class="more" onclick="event.stopPropagation();openDayList('${ds}')">+${ts.length-3} más</div>`;
      h+='</div>';
    } else {
      h+=`<div class="${cls}" onclick="pickDay('${ds}')"><div class="dn">${dn}</div><div class="mdots">${ts.slice(0,4).map(t=>`<i style="--c:${t.status==='done'?'#9ca3af':TYPES[t.type].color}"></i>`).join('')}</div></div>`;
    }
  }
  return h+'</div>';
}

function guessGender(name){const f=String(name||'').trim().split(/\s+/)[0].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(!f)return '';return FEM_N.has(f)?'Mujer':MAS_N.has(f)?'Hombre':''}
function genderOf(a){if(!a)return '';return a.gender||guessGender(a.name)} /* el género solo lo define el coach */
/* Ciclo menstrual (solo mujeres): último registro tipo 'cycle' en pt_evo; lo pueden editar atleta y coach */
const cycleOf=aid=>S.evo.filter(e=>e.kind==='cycle'&&e.athleteId===aid).sort((x,y)=>y.ts-x.ts)[0]||null;
function cyclePhase(c,ds){
  if(!c||!c.tracking||!c.last)return null;const L=+c.len||28,diff=Math.round((parse(ds||TODAY)-parse(c.last))/864e5);if(diff<0)return null;const irr=!!c.irregular,P=(c.endFor===c.last&&c.endDay!=null&&(irr||diff<L))?+c.endDay:(+c.plen||5);
  if(irr){const day=diff+1,ov=L-14,ph=day<=P?'Menstrual':day<ov-1?'Folicular':day<=ov+1?'Ovulatoria':'Lútea';return {day,len:L,phase:ph,next:null,irregular:true,menstrual:ph==='Menstrual'}}
  const day=diff%L+1,ov=L-14,ph=day<=P?'Menstrual':day<ov-1?'Folicular':day<=ov+1?'Ovulatoria':'Lútea',next=addDays(c.last,(Math.floor(diff/L)+1)*L);
  return {day,len:L,phase:ph,next,menstrual:ph==='Menstrual'};
}
const PH_TIP={Menstrual:'Días de sangrado. Es normal tener menos energía; se puede bajar un poco la intensidad si hace falta.',Folicular:'La energía suele subir. Buen momento para entrenamientos más pesados.',Ovulatoria:'Fuerza y energía altas. Cuida la técnica: hay un poco más de laxitud en articulaciones.',Lútea:'Puede haber más cansancio, hinchazón o antojos. La sensación de esfuerzo suele ser mayor.'};
const dropSVG=(s=18,cls='')=>`<svg class="cdrop ${cls}" width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6c-.35 0-.66.18-.85.47C9.5 5.6 5 11.4 5 15.2A7 7 0 0 0 19 15.2c0-3.8-4.5-9.6-6.15-12.13A1 1 0 0 0 12 2.6z" fill="currentColor"/><ellipse cx="9.2" cy="14.6" rx="1.35" ry="2.5" fill="#fff" opacity=".75" transform="rotate(-18 9.2 14.6)"/><circle cx="10.4" cy="10.9" r=".8" fill="#fff" opacity=".6"/></svg>`;
function periodDayHTML(a,role){
  const nw=a.id==='__new',c=nw?null:cycleOf(a.id),p=cyclePhase(c),cur=nw?(S.ui.newCyc||0):p&&p.menstrual?p.day:0,me=role==='athlete'||role==='finish',fin=role==='finish';
  return `<div class="per"><div class="per-h"><span class="per-ico">${dropSVG(22)}</span><div style="flex:1;min-width:160px"><b>${me?'¿En qué día de tu periodo estás?':'¿En qué día de su periodo está?'}</b>${qm('periodo_dia')}<div class="per-s">${cur?`Hoy: <b>día ${cur}</b> de ${me?'tu':'su'} periodo`:fin?'Si hoy estás en tu periodo, toca el día en el que vas.':me?'Toca el día en el que vas. Si no estás en tu periodo, déjalo así.':nw?'Opcional: marca el día si hoy está en su periodo.':'Sin periodo registrado hoy.'}${!cur&&c&&c.tracking&&c.last?`<br>Último inicio: <b>${dmy(c.last)}</b>`:''}</div></div></div>
    <div class="per-days">${[1,2,3,4,5].map(n=>`<button type="button" class="pday ${cur===n?'on':''}" aria-pressed="${cur===n}" onclick="cycDay('${a.id}','${role}',${n})">${dropSVG(15)}<span>Día ${n}</span></button>`).join('')}${cur?`<button type="button" class="pday end" onclick="cycDay('${a.id}','${role}',0)">Ya terminó</button>`:''}</div>
    ${nw?'':`<div class="per-more"><label class="per-date">${me?'¿Empezó otro día?':'Empezó otro día'} <input type="date" max="${TODAY}" min="${addDays(TODAY,-90)}" value="" onchange="cycStart('${a.id}','${role}',this.value)"></label>${fin?'':`<label class="per-irr"><input type="checkbox" ${c&&c.irregular?'checked':''} onchange="cycIrr('${a.id}','${role}',this.checked)"> ${me?'Mi ciclo es irregular':'Ciclo irregular'} ${qm('irregular')}</label>`}</div>`}</div>`;
}
function cycStart(aid,role,ds){if(!ds||ds>TODAY)return;const n=Math.round((parse(TODAY)-parse(ds))/864e5)+1;const c=cycleOf(aid)||{};S.ui.cycA=aid;
  cycWrite(aid,{tracking:true,last:ds,plen:Math.max(+c.plen||5,Math.min(n,7)),endDay:null,endFor:null});
  if(role!=='coach')pushActivity(aid,'ready',`registró que su periodo empezó el ${dmy(ds)}`);toast(`Inicio del periodo: ${dmy(ds)}`);cycRerender(role)}
function cycIrr(aid,role,on){S.ui.cycA=aid;cycWrite(aid,{irregular:!!on});toast(on?'Ciclo irregular: la menstruación se cuenta solo cuando se marca':'Ciclo regular');cycRerender(role)}
function cycDay(aid,role,n){
  if(aid==='__new'){S.ui.newCyc=n;const el=document.getElementById('na_cyc');if(el)el.innerHTML=periodDayHTML({id:'__new',name:''},'coach');return}
  S.ui.cycA=aid;const c=cycleOf(aid),p=cyclePhase(c),a=S.athletes.find(x=>x.id===aid),first=(a.name||'').split(' ')[0];
  if(n>0){const prev=c||{};cycWrite(aid,{tracking:true,last:addDays(TODAY,-(n-1)),plen:Math.max(+prev.plen||5,n),endDay:null,endFor:null});
    if(role!=='coach')pushActivity(aid,'ready',`registró que va en el día ${n} de su periodo`);toast(role!=='coach'?`Listo: día ${n} de tu periodo 💧`:`${first}: día ${n} de su periodo`)}
  else{if(!p||!p.menstrual)return;cycWrite(aid,{endDay:p.day-1,endFor:c.last});if(role!=='coach')pushActivity(aid,'ready','registró que terminó su periodo');toast('Listo, periodo terminado')}
  cycRerender(role);
}
function cycleHTML(a,role){
  if(genderOf(a)!=='Mujer')return '';const c=cycleOf(a.id),on=!!(c&&c.tracking),p=cyclePhase(c),pre=role==='coach'?'nc':'ac';
  return `${periodDayHTML(a,role)}<div class="cyc ${on?'on':''}"><div class="ch"><span class="ico">${ic('drop',17,on)}</span><div style="flex:1;min-width:150px"><b>Fase menstrual</b>${qm('ciclo')}<div class="muted" style="font-size:12px">${on?(p?`Día ${p.day} de ${p.len} · <b>${p.phase}</b> · ${p.next?`próxima menstruación aprox. ${dmy(p.next).slice(0,5)}`:'ciclo irregular: se marca al empezar'}`:'Registrado · agrega la fecha de inicio de la última menstruación'):'Incluir este dato ayuda a ajustar la intensidad del entrenamiento'}</div></div>
    <button type="button" class="btn ${on?'ghost':'soft'} sm" onclick="cycToggle('${a.id}','${role}')">${on?'Quitar dato':'Incluir fase menstrual'}</button></div>
    ${on?`<div class="row" style="flex-wrap:wrap;margin-top:10px;align-items:end"><div class="field" style="min-width:150px;margin:0"><label>Inicio de la última menstruación</label><input type="date" id="${pre}_last" max="${TODAY}" value="${esc(c.last||'')}"></div><div class="field" style="min-width:110px;margin:0"><label>Duración del ciclo (días)</label><input type="number" id="${pre}_len" min="20" max="45" value="${esc(c.len||28)}"></div><div class="field" style="min-width:110px;margin:0"><label>Días de sangrado</label><input type="number" id="${pre}_plen" min="2" max="10" value="${esc(c.plen||5)}"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn soft sm" onclick="cycSave('${a.id}','${role}',true)">${ic('drop',12,true)} Hoy empezó</button><button type="button" class="btn primary sm" onclick="cycSave('${a.id}','${role}')">Guardar</button></div></div>
      ${p?`<div class="ph"><span class="phase-pill">${ic('drop',11,true)} Fase ${p.phase}</span> ${PH_TIP[p.phase]}</div>`:''}`:''}
  </div>`;
}
function cycWrite(aid,data){const prev=cycleOf(aid)||{};S.evo.push({id:uid(),athleteId:aid,date:TODAY,kind:'cycle',ts:Date.now(),tracking:true,last:prev.last||'',len:prev.len||28,plen:prev.plen||5,irregular:!!prev.irregular,...(prev.endFor&&prev.endFor===(data.last||prev.last)?{endDay:prev.endDay,endFor:prev.endFor}:{}),...data})}
function cycRerender(role){if(role==='finish'){reAthModal(S.ui.finTask);return}const el=document.getElementById('na_cyc');if(role==='coach'&&el){el.innerHTML=cycleHTML(S.athletes.find(x=>x.id===S.ui.cycA),'coach');save();renderApp()}else commit()}
function cycToggle(aid,role){S.ui.cycA=aid;const c=cycleOf(aid);cycWrite(aid,{tracking:!(c&&c.tracking)});if(role==='athlete')pushActivity(aid,'ready',c&&c.tracking?'quitó el dato de fase menstrual':'empezó a registrar su fase menstrual');cycRerender(role)}
function cycSave(aid,role,today){S.ui.cycA=aid;const pre=role==='coach'?'nc':'ac';const last=today?TODAY:gv(pre+'_last'),len=+gv(pre+'_len')||28,plen=+gv(pre+'_plen')||5;
  if(!last){toast('Pon la fecha de inicio de la última menstruación');return}if(len<20||len>45){toast('La duración del ciclo suele estar entre 20 y 45 días');return}
  cycWrite(aid,{tracking:true,last,len,plen});if(role==='athlete'&&today)pushActivity(aid,'ready','registró inicio de menstruación');cycRerender(role);toast('Dato guardado')}
const ZDESC=['Muy suave · calentar y recuperar','Suave · resistencia base, puedes platicar','Moderada · ritmo sostenido, frases cortas','Intensa · cuesta hablar','Máxima · esfuerzos muy cortos'];

  const s=DEL.step;
  if(!s)return `<div class="del-mini"><button type="button" onclick="delGo(1)">🗑️ Eliminar mi perfil</button></div>`;

    <div class="del-h"><span class="del-e">🔒</span><div><b class="tt">Último paso</b><div>Para confirmar, marca la casilla y escribe <b>ELIMINAR</b>.</div></div></div>
    <label class="del-chk"><input type="checkbox" id="del_ok" onchange="delCheck()"> Entiendo que mi cuenta y todo mi historial se borrarán para siempre</label>
    <input id="del_txt" class="del-in" autocomplete="off" autocapitalize="characters" placeholder="Escribe ELIMINAR" oninput="delCheck()">
    <div class="del-f"><button type="button" class="btn ghost sm" onclick="delGo(0)">Cancelar</button><button type="button" class="btn del-btn sm" id="del_go" disabled onclick="runDeleteAccount()">🗑️ Eliminar para siempre</button></div></div>`;
  return `<div class="del-box"><div class="del-h"><span class="del-e spin">🧹</span><div><b class="tt">Eliminando tu perfil…</b><div>No cierres esta página.</div></div></div><div class="del-steps" id="delSteps">${delStepsHTML()}</div></div>`;
}
const DEL_STEPS=[['files','📸','Borrando tus fotos y archivos'],['data','🗂️','Borrando tu historial'],['acct','🔐','Cerrando y eliminando tu cuenta']];
function delStepsHTML(){return DEL_STEPS.map(([k,e,t])=>{const st=(DEL.st||{})[k]||'wait';return `<div class="ds ${st}"><span>${st==='ok'?'✅':st==='run'?e:'⏳'}</span>${t}${st==='run'?'…':''}</div>`}).join('')}
function delPaint(){const el=document.getElementById('delSteps');if(el)el.innerHTML=delStepsHTML()}
function delGo(n){DEL.step=n;renderApp();const b=document.querySelector('.del-box,.del-mini');if(b&&n)b.scrollIntoView({behavior:'smooth',block:'center'})}
function delCheck(){const ok=document.getElementById('del_ok')?.checked&&String(document.getElementById('del_txt')?.value||'').trim().toUpperCase()==='ELIMINAR';const b=document.getElementById('del_go');if(b)b.disabled=!ok}
async function runDeleteAccount(){
  if(IS_COACH||DEL.busy)return;
  DEL.busy=true;DEL.step=3;DEL.st={files:'run'};clearTimeout(flushT);dirty=false;renderApp();
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  try{
    // 1) archivos de evidencias (Storage)
    try{if(SB.storage){const {data}=await SB.from('evidence').select('path').eq('athlete_email',ME.email);const paths=(data||[]).map(x=>x.path).filter(Boolean);
      for(let i=0;i<paths.length;i+=100)await SB.storage.from('evidencias').remove(paths.slice(i,i+100))}}catch(e){console.warn('archivos',e)}
    DEL.st={files:'ok',data:'run'};delPaint();await wait(500);
    // 2) historial + 3) cuenta (en una sola operación segura en el servidor)
    const {error}=await SB.rpc('delete_my_account');
    if(error)throw error;
    DEL.st={files:'ok',data:'ok',acct:'run'};delPaint();await wait(500);
    try{Object.keys(localStorage).filter(k=>k.startsWith('ptp_v2_ui_'+ME.email)).forEach(k=>localStorage.removeItem(k))}catch(e){}
    try{await SB.auth.signOut()}catch(e){}
    DEL.st={files:'ok',data:'ok',acct:'ok'};delPaint();await wait(600);
    S=null;ME=null;delDoneScreen();
  }catch(e){
    console.error(e);DEL.busy=false;DEL.step=0;const m=String(e.message||e);
    renderApp();
    toast(/delete_my_account|function|schema cache/i.test(m)?'Esta opción aún no está activada. Pídele a tu coach que la active.':/coach/.test(m)?'La cuenta del coach no se puede eliminar desde aquí.':'No se pudo eliminar tu perfil. Intenta de nuevo.');
  }
}

  document.getElementById('app').innerHTML=`<div class="del-done"><div class="del-big">👋</div><h2>Tu cuenta fue eliminada</h2>

    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">${again}</div></div>`;
  scrollTo(0,0);
}

function shrinkToSquare(file,size=320){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const s=Math.min(img.naturalWidth,img.naturalHeight),c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,size,size);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.82))};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('formato'))};img.src=url})}
async function uploadAvatar(aid,file,role){
  if(!file)return;if(!/^image\//.test(file.type)&&!/\.(heic|heif|jpe?g|png|webp)$/i.test(file.name)){toast('Elige una imagen');return}
  if(file.size>20*1024*1024){toast('La imagen es muy pesada (máx. 20 MB)');return}
  toast('Subiendo foto…');let data;try{data=await shrinkToSquare(file)}catch(e){toast('No se pudo leer esa imagen. Prueba con otra (JPG o PNG).');return}
  const id='avatar-'+aid;let e=S.evo.find(x=>x.id===id);if(!e){e={id,athleteId:aid,kind:'avatar'};S.evo.push(e)}
  Object.assign(e,{img:data,date:TODAY,ts:Date.now()});
  if(role==='athlete')pushActivity(aid,'ready','actualizó su foto de perfil');
  if(role==='coach'&&document.getElementById('na_av'))document.getElementById('na_av').innerHTML=avatarUploader(S.athletes.find(x=>x.id===aid),'coach');
  commit();toast('Foto de perfil actualizada');
}
function removeAvatar(aid,role){const e=S.evo.find(x=>x.id==='avatar-'+aid);if(e){e.img='';e.ts=Date.now()}if(role==='coach'&&document.getElementById('na_av'))document.getElementById('na_av').innerHTML=avatarUploader(S.athletes.find(x=>x.id===aid),'coach');commit()}
const ACT=[[1.2,'Sedentario'],[1.375,'Ligero (1–3 días/sem)'],[1.55,'Moderado (3–5 días/sem)'],[1.725,'Intenso (6–7 días/sem)'],[1.9,'Muy intenso / doble sesión']];
function lastEvoOf(aid,k){const e=S.evo.filter(x=>x.athleteId===aid&&x[k]!=null&&x[k]!=='').sort((x,y)=>y.date.localeCompare(x.date))[0];return e?+e[k]:null}
function bodyComp(a,wo){
  const w=wo!==undefined?wo:lastWeight(a.id),h=+a.height||null,bf=a.bodyFat!=null&&a.bodyFat!==''?+a.bodyFat:lastEvoOf(a.id,'grasa'),mm=a.muscleMass!=null&&a.muscleMass!==''?+a.muscleMass:null,age=+a.age||null,act=+a.activity||1.55;
  const m=h?h/100:null,imc=w&&m?w/(m*m):null,fatKg=w&&bf!=null?w*bf/100:null,lean=fatKg!=null?w-fatKg:null;
  const imm=mm&&m?mm/(m*m):lean&&m?lean/(m*m):null,immSrc=mm?'masa muscular':'masa libre de grasa';
  let geb=null,gebSrc='';
  if(+a.geb){geb=+a.geb;gebSrc='registrado por el coach'}
  else if(lean){geb=370+21.6*lean;gebSrc='Katch-McArdle (con masa libre de grasa)'}
  else if(w&&h&&age&&genderOf(a)){geb=10*w+6.25*h-5*age+(genderOf(a)==='Hombre'?5:-161);gebSrc='Mifflin-St Jeor'}
  const get=geb?geb*act:null;
  return {w,h,bf,mm,age,act,imc,fatKg,lean,imm,immSrc,geb,gebSrc,get,kcalT:+a.kcalTarget||(a.nutrition&&a.nutrition.kcalTarget)||null};
}
function compHTML(a,role){

  <div class="comp">

    <div class="c"><div class="l">% grasa</div><div class="v">${f1(c.bf)}<small> %</small></div>${c.fatKg!=null?`<div class="x">${f1(c.fatKg)} kg de grasa</div>`:''}</div>

    <div class="c"><div class="l">GEB ${qm('geb')}</div><div class="v">${n0(c.geb)}<small> kcal</small></div>${c.geb?`<div class="x">${c.gebSrc}</div>`:''}</div>
    <div class="c"><div class="l">GET ${qm('get')}</div><div class="v">${n0(c.get)}<small> kcal</small></div>${c.get?`<div class="x">GEB × ${c.act}</div>`:''}</div>

  </div></div>`;

function profileChips(a){const w=lastWeight(a.id),bc=bodyComp(a);const cp=genderOf(a)==='Mujer'?cyclePhase(cycleOf(a.id)):null;const it=[genderOf(a),cp&&`Fase ${cp.phase.toLowerCase()} · día ${cp.day}`,a.age&&`${a.age} años`,w&&`${w} kg`,a.height&&`${a.height} cm`,bc.bf!=null&&`${bc.bf}% grasa`,bc.get&&`GET ${fmtN(bc.get)} kcal`,a.occupation,a.sport,a.hrRest&&`FC reposo ${a.hrRest} lpm`,!(a.plan&&a.plan.scheduled)&&OLDPLANS[a.id]&&`Plan actual: ${OLDPLANS[a.id].title||'activo'}`].filter(Boolean);return it.length?`<div class="prof">${it.map(x=>`<span class="gtag">${esc(x)}</span>`).join('')}</div>`:''}
function saveAthlete(id){
  const n=gv('na_n');if(!n){toast('Escribe un nombre');return}
  const e=gv('na_e');if(e&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){toast('Revisa el correo');return}
  if(e&&S.athletes.some(x=>x.id!==id&&x.email.toLowerCase()===e.toLowerCase())){toast('Ya existe un cliente con ese correo');return}
  const hr=+gv('na_hr');if(hr&&(hr<30||hr>120)){toast('La FC en reposo debe estar entre 30 y 120 lpm');return}
  const age=+gv('na_age');if(age&&(age<10||age>90)){toast('Revisa la edad');return}
  const data={name:n,email:e||'—',goal:gv('na_g'),age:gv('na_age'),gender:gv('na_gen'),genderTs:(id&&gv('na_gen')===genderOf(S.athletes.find(x=>x.id===id)))?(S.athletes.find(x=>x.id===id).genderTs||0):Date.now(),occupation:gv('na_oc'),sport:gv('na_sp'),hrRest:gv('na_hr'),height:gv('na_h'),bodyFat:gv('na_bf'),muscleMass:gv('na_mm'),activity:gv('na_act'),geb:gv('na_geb'),kcalTarget:gv('na_kt'),goalWeight:gv('na_gw')};
  const w=parseFloat(gv('na_w'));
  if(id){Object.assign(S.athletes.find(x=>x.id===id),data);const bf=parseFloat(gv('na_bf')),prevBf=lastEvoOf(id,'grasa');if((!isNaN(w)&&w!==lastWeight(id))||(!isNaN(bf)&&bf!==prevBf)){const ev={id:uid(),athleteId:id,date:TODAY};if(!isNaN(w))ev.peso=w;if(!isNaN(bf))ev.grasa=bf;S.evo.push(ev)}closeModal();commit();toast('Perfil actualizado');return}
  if(!e){toast('El correo es obligatorio: será su usuario del portal');return}
  const em=e.toLowerCase();if(S.athletes.some(x=>x.id===em)){toast('Ese correo ya está en tus clientes');return}
  const pid=gv('na_p'),btn=document.querySelector('#modalRoot .modal-f .btn.primary');btn.disabled=true;btn.textContent='Creando acceso…';
  createAccount(n,em).then(r=>{
    const a={...data,id:em,email:em,color:colorFor(em)};
    S.athletes.push(a);S.ui.athleteId=a.id;
    if(data.gender==='Mujer'&&S.ui.newCyc){const n=S.ui.newCyc;cycWrite(a.id,{tracking:true,last:addDays(TODAY,-(n-1)),plen:Math.max(5,n)})}S.ui.newCyc=0;S.ui.section='clientes';S.ui.coachTab='plan';
    if(!isNaN(w))S.evo.push({id:uid(),athleteId:a.id,date:TODAY,peso:w});
    commit();showCreds(n,em,r.password,r.existed,pid);
  }).catch(err=>{btn.disabled=false;btn.textContent='Crear cliente';toast('No se pudo crear la cuenta: '+(err.message||err))});
}

  root.querySelectorAll('[data-bn]').forEach(el=>d.blocks[+el.dataset.bn].name=el.value);

  root.querySelectorAll('[data-af]').forEach(el=>{const [i,f]=el.dataset.af.split('|');d.attach[+i][f]=el.value});

function libVideoSelect(){const xs=S.library.filter(x=>x.video);return xs.length?`<div class="field"><label>…o tómalo de tu biblioteca</label><select onchange="pickLibVideo(this.value)"><option value="">Elegir ejercicio con video</option>${xs.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>`:''}

const libFind=n=>S.library.find(x=>x.name.toLowerCase()===String(n||'').trim().toLowerCase());
function libFill(el){const ex=libFind(el.value);if(!ex||!ex.video)return;const key=el.dataset.ef!=null?'ef':'pf';const p=el.dataset[key].split('|');const v=document.querySelector(`[data-${key}="${p[0]}|${p[1]}|video"]`);if(v&&!v.value){v.value=ex.video;v.classList.add('flash');v.dispatchEvent(new Event('input'))}}
function loadPlanDay(v){collectDraft();const [pid,i]=v.split('|');const p=S.plans.find(x=>x.id===pid),d=p.days[+i];const att=S.ui.draft.attach;S.ui.draft={title:d.name,blocks:dayToBlocks(d,0),attach:att,repeat:S.ui.draft.repeat||0};rerenderBuilder();toast(`Rutina «${d.name}» cargada (fase 1) — edítala a tu gusto`)}
function saveTask(type){
  const aid=S.ui.athleteId, a=curA(), ds=S.ui.addDate;
  const base={athleteId:aid,date:ds,type,status:'pending',progress:{sets:{}},feedback:null,createdAt:Date.now()};
  let created=[];
  if(type==='entrenamiento'&&S.ui.draft&&S.ui.draft.editId)return saveEditTask();
  if(type==='entrenamiento'){
    collectDraft();const d=S.ui.draft;
    d.blocks=d.blocks.map(b=>({...b,exercises:b.exercises.filter(e=>e.name.trim())})).filter(b=>b.exercises.length);
    if(!d.title.trim()){toast('Ponle nombre al entrenamiento');rerenderBuilder();return}
    if(!d.blocks.length){toast('Agrega al menos un ejercicio');S.ui.draft.blocks=[{name:'Calentamiento',exercises:[{name:'',sets:'',reps:'',rest:'',video:''}]}];rerenderBuilder();return}
    const bad=d.blocks.flatMap(b=>b.exercises).find(e=>e.video&&!ytId(e.video))||d.attach.find(x=>x.type==='video'&&x.value&&!ytId(x.value));
    if(bad){toast('Hay un link de video que no es válido');rerenderBuilder();return}
    for(let w=0;w<=d.repeat;w++) created.push({...base,id:uid(),date:addDays(ds,w*7),title:d.title.trim(),data:JSON.parse(JSON.stringify({blocks:d.blocks,attach:d.attach.filter(x=>x.value||x.type==='formulario')}))});
  }
  else if(type==='video'){
    const url=gv('f_vurl');if(!ytId(url)){toast('Pega un link de video válido');return}
    created.push({...base,id:uid(),title:gv('f_vtitle')||'Video',data:{url,note:gv('f_vnote')}});
  }
  else if(type==='nutricion') created.push({...base,id:uid(),title:gv('f_ntitle')||'Plan de alimentación',data:{kcal:gv('f_kcal'),prot:gv('f_prot'),meals:gv('f_meals')}});
  else if(type==='documento'){if(!gv('f_dtitle')){toast('Ponle nombre al documento');return}created.push({...base,id:uid(),title:gv('f_dtitle'),data:{url:gv('f_durl'),note:gv('f_dnote')}})}
  else if(type==='evolucion'){const mets=[...document.querySelectorAll('.f_met:checked')].map(x=>x.value);if(!mets.length){toast('Elige al menos una medida');return}created.push({...base,id:uid(),title:'Registro de evolución',data:{metrics:mets,note:gv('f_enote')}})}
  else if(type==='sesion') created.push({...base,id:uid(),title:gv('f_stitle')||`Sesión ${gv('f_smode').toLowerCase()}`,data:{mode:gv('f_smode'),time:gv('f_stime'),dur:gv('f_sdur'),place:gv('f_splace')}});
  else if(type==='mensaje'){if(!gv('f_mtext')){toast('Escribe el mensaje');return}created.push({...base,id:uid(),title:'Mensaje programado',data:{text:gv('f_mtext'),time:gv('f_mtime')}})}
  else if(type==='formulario'){if(ds<TODAY)return;const f=gv('f_form');created.push({...base,id:uid(),title:FORMS[f].name,data:{form:f,note:gv('f_fnote')}})}
  if(type==='entrenamiento')created.forEach(t=>(t.data.blocks||[]).forEach(b=>b.exercises.forEach(e=>{const nm=String(e.name||'').trim();if(!nm)return;const x=libFind(nm);if(!x)S.library.push({id:uid(),name:nm,group:guessGroup(t.title),type:'Hipertrofia',video:e.video||'',notes:'',src:['Coach']});else if(e.video&&!x.video)x.video=e.video})));
  S.tasks.push(...created);
  const first=created[0];
  pushNotif(aid,`Tu coach agendó «${first.title}» para el ${longDate(first.date)}`);
  closeModal();
  S.ui.month=first.date.slice(0,7);S.ui.coachTab='plan';S.ui.selDay=first.date;S.ui.athTab='agenda';
  commit();
  toast(created.length>1?`${created.length} tareas asignadas a ${a.name}`:`Asignado a ${a.name} · ${dmy(first.date)}`);
}
