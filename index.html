function starsRO(n){return `<span class="stars">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}">★</i>`).join('')}</span>`}
function trainingStats(t){
  const f=t.feedback||{},tr=sessTrimp(f,S.athletes.find(a=>a.id===t.athleteId)),vol=volOf(t);
  return `<div class="stats">
    <span style="color:${t.status==='done'?'var(--green)':'var(--ink)'}">${ic('checkc',17)} Cumplimiento: ${pct(t)} %</span>
    <span>${ic('clock',17)} Duración: ${f.duration||'—'}</span>
    <span>${ic('target',17)} RPE: ${f.effort??0} / 10</span>
    ${t.status==='done'&&f.durMin?`<span>${ic('activity',17)} Carga: ${fmtN(f.durMin*(f.effort||0))} UA</span>`:''}
    ${f.hrAvg?`<span>${ic('heart',17)} ${f.hrAvg} lpm prom.</span>`:''}
    ${tr?`<span>${ic('heart',17)} TRIMP: ${tr}${trimpOf(f.zones)?'':' (est.)'}</span>`:''}
    ${vol?`<span>${ic('bar',17)} Volumen: ${fmtN(vol)} kg</span>`:''}
    <span>Valoración: ${starsRO(f.rating||0)}</span></div>`;
}
function exStatus(t,bi,ei,e){
  const n=Math.max(1,parseInt(e.sets)||1);let d=0;for(let s=0;s<n;s++)if(t.progress?.sets?.[`${bi}-${ei}-${s}`])d++;
  return d===n?['done','Completado']:d>0?['partial',`${d}/${n} series`]:[status(t)==='missed'?'missed':'pending',status(t)==='missed'?'No realizado':'Pendiente'];
}
function attachPills(t,role){
  const at=t.data.attach||[];if(!at.length)return'';
  return `<div style="margin-top:14px"><div class="muted" style="font-size:12px;font-weight:600">Incluido en la sesión</div><div class="att-pills">${at.map((x,i)=>{
    const c=TYPES[x.type].color;
    let act='';
    if(x.type==='video') act=`playVideo('${esc(x.value)}','${esc(x.title).replace(/'/g,'')}')`;
    else if(x.type==='documento') act=`window.open('${esc(x.value)}','_blank')`;
    else if(x.type==='formulario') act=role==='athlete'?`openFormFill('${t.id}',${i})`:`showAttachText('${t.id}',${i})`;
    else act=`showAttachText('${t.id}',${i})`;
    const answered=x.type==='formulario'&&t.attachAns?.[i];
    return `<button class="att-pill" style="--c:${c}" onclick="${act}"><span class="d"></span>${ic(TYPES[x.type].icon,14)} ${esc(x.title)}${answered?' ✓':''}</button>`}).join('')}</div><div id="attText_${t.id}"></div></div>`;
}
function showAttachText(tid,i){
  const t=taskById(tid),x=t.data.attach[i],el=document.getElementById('attText_'+tid);if(!el)return;
  if(x.type==='formulario'){const ans=t.attachAns?.[i];el.innerHTML=`<div class="note"><b>${FORMS[x.value].name}</b>\n${ans?FORMS[x.value].qs.map((q,k)=>`${q.q}: ${ans[k]??'—'}`).join('\n'):'El atleta aún no responde.'}</div>`;return}
  el.innerHTML=`<div class="note" style="border-left:3px solid ${TYPES[x.type].color}"><b>${esc(x.title)}</b>\n${esc(x.value)}</div>`;
}
function detailBody(t,role){
  const d=t.data;
  switch(t.type){
  case 'video': {const info=vInfo(d.url);return `${d.note?`<div class="note" style="margin-bottom:12px">${esc(d.note)}</div>`:''}
    <div class="vframe">${vEmbed(info,false)}</div>
    <div class="muted" style="font-size:12px;margin-top:8px;display:flex;gap:6px;align-items:center">${ic('link',13)} ${esc(d.url)}</div>`}
  case 'nutricion': return `<div class="row" style="margin-bottom:12px"><div class="card kpi"><div class="l">Calorías</div><div class="v">${esc(d.kcal||'—')}<small> kcal</small></div></div><div class="card kpi"><div class="l">Proteína</div><div class="v">${esc(d.prot||'—')}<small> g</small></div></div></div>
    ${(d.meals||'').split('\n').filter(Boolean).map(m=>`<div class="feed-item" style="padding:9px 4px"><div class="fi" style="background:#ccfbf1;color:#0d9488">${ic('food',15)}</div><div class="ft" style="padding-top:6px">${esc(m)}</div></div>`).join('')||'<div class="muted">Sin comidas detalladas</div>'}`;
  case 'documento': return `${d.note?`<div class="note" style="margin-bottom:12px">${esc(d.note)}</div>`:''}<a class="btn soft" href="${esc(d.url||'#')}" target="_blank" rel="noopener">${ic('ext',15)} Abrir documento</a>`;
  case 'evolucion': {const e=t.result;return `${d.note?`<div class="note" style="margin-bottom:12px">${esc(d.note)}</div>`:''}
    ${role==='athlete'&&t.status!=='done'?`<div class="row" style="flex-wrap:wrap">${d.metrics.map(m=>`<div class="field" style="min-width:120px"><label>${METRIC[m]}</label><input type="number" step="0.1" id="ev_${m}" placeholder="0.0"></div>`).join('')}</div>`
      :e?`<div class="row">${d.metrics.map(m=>`<div class="card kpi"><div class="l">${METRIC[m]}</div><div class="v">${e[m]??'—'}</div></div>`).join('')}</div>`:`<div class="muted">Se pedirá: ${d.metrics.map(m=>METRIC[m]).join(', ')}</div>`}`}
  case 'sesion': return `<div class="row"><div class="card kpi"><div class="l">Modalidad</div><div class="v" style="font-size:17px">${esc(d.mode)}</div></div><div class="card kpi"><div class="l">Hora</div><div class="v" style="font-size:17px">${esc(d.time)}</div></div><div class="card kpi"><div class="l">Duración</div><div class="v" style="font-size:17px">${esc(d.dur)} <small>min</small></div></div></div>
    ${d.place?`<div style="margin-top:12px">${/^https?:/.test(d.place)?`<a class="btn soft" target="_blank" rel="noopener" href="${esc(d.place)}">${ic('ext',15)} Unirme a la sesión</a>`:`<div class="note">📍 ${esc(d.place)}</div>`}</div>`:''}
    ${t.confirmed?`<div style="margin-top:12px"><span class="pill done">${ic('check',12)} Asistencia confirmada</span></div>`:''}`;
  case 'mensaje': return `<div class="msg them" style="max-width:100%"><div class="sch">${ic('clock',11)} Programado ${dmy(t.date)} · ${esc(d.time)}</div>${esc(d.text)}</div>`;
  case 'formulario': {const f=FORMS[d.form];return `${d.note?`<div class="note" style="margin-bottom:12px">${esc(d.note)}</div>`:''}
    ${f.qs.map((q,i)=>`<div class="qa"><div class="q">${esc(q.q)}</div><b>${t.answers?esc(t.answers[i]??'—'):'<span class="muted" style="font-weight:400">Sin respuesta</span>'}</b></div>`).join('')}`}
  case 'entrenamiento': return trainingView(t,role);
  }
}
const METRIC={peso:'Peso (kg)',grasa:'% grasa',cintura:'Cintura (cm)',cadera:'Cadera (cm)'};

function trainingView(t,role){
  const live=role==='athlete'&&t.status!=='done';
  let h=progBarHTML(t,role)+trainingStats(t)+readinessHTML(t);
  if(live){
    const tm=S.ui.timer&&S.ui.timer.taskId===t.id;
    h+=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap">${tm?`<span class="timer"><span class="pulse"></span><span class="live-timer" data-start="${S.ui.timer.start}">00:00:00</span></span>`:`<button class="btn primary" onclick="openReadiness('${t.id}')">${ic('play',14,true)} Iniciar entrenamiento</button>`}<span class="muted" style="font-size:12px;display:inline-flex;align-items:center">Toca cada serie al terminarla y anota el peso ${qm('kg')}</span></div>`;
  }
  h+=blocksViewHTML(t,live);
  h+=attachPills(t,role);
  if(t.status==='done'&&t.feedback?.comment) h+=`<div style="margin-top:14px"><div class="muted" style="font-size:12px;font-weight:600;margin-bottom:6px">Comentario del atleta</div><div class="note">💬 ${esc(t.feedback.comment)}</div></div>`;
  if(live) h+=finishHTML(t);
  return h;
}
function progBarHTML(t,role){
  const tot=totalSets(t),dn=doneSets(t),p=tot?Math.round(dn/tot*100):0;
  let exT=0,exD=0;(t.data.blocks||[]).forEach((b,bi)=>b.exercises.forEach((e,ei)=>{exT++;const n=Math.max(1,parseInt(e.sets)||1);let k=0;for(let s=0;s<n;s++)if(t.progress?.sets?.[`${bi}-${ei}-${s}`])k++;if(k===n)exD++}));
  S.ui.prog=S.ui.prog||{};const prev=role==='athlete'?(S.ui.prog[t.id]??0):p;if(role==='athlete')S.ui.prog[t.id]=p;
  const msg=p>=100?'¡Lo lograste! Ahora finaliza abajo':p>=75?'¡Ya casi!':p>=50?'Vas a la mitad':p>=25?'Buen arranque':p>0?'¡Arrancaste!':'¡A darle!';
  return `<div class="wprog ${p>=100?'done':''}" data-to="${p}" data-prev="${prev}"><div class="r1"><span><b>${p}%</b> <span class="msg">${msg}</span></span><span>Ejercicios ${exD}/${exT} · Series ${dn}/${tot}</span></div>
  <div class="track" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100">${[25,50,75].map(m=>`<i class="tick ${p>=m?'on':''}" style="left:${m}%"></i>`).join('')}<div class="fill" style="width:${prev}%"></div><div class="head" style="left:${prev}%">${ic('dumbbell',16)}</div><div class="goal ${p>=100?'won':''}">${ic('trophy',18)}</div></div></div>`;
}
function animateProg(){document.querySelectorAll('#modalRoot .wprog').forEach(el=>{const to=+el.dataset.to,from=+el.dataset.prev;if(to===from)return;requestAnimationFrame(()=>requestAnimationFrame(()=>{el.querySelector('.fill').style.width=to+'%';const hd=el.querySelector('.head');hd.style.left=to+'%';hd.classList.add('bump')}))})}
function finishHTML(t){
  const defMin=S.ui.finMin??(S.ui.timer&&S.ui.timer.taskId===t.id?Math.max(1,Math.round((Date.now()-S.ui.timer.start)/60000)):60);
  return `<div class="finish"><h4>Finalizar entrenamiento</h4>
   <div class="field" style="max-width:200px"><label>Duración (min) ${qm('duracion')}</label><input type="number" id="fin_min" min="1" value="${defMin}" oninput="updLoadCalc()"></div>
   ${rpeField()}
   <div class="calc" id="loadCalc"></div>
   ${zoneBtnsField()}
   ${hrAvgField()}
   ${zonesField()}
   ${genderOf(S.athletes.find(x=>x.id===t.athleteId))==='Mujer'?`<div class="field">${periodDayHTML(S.athletes.find(x=>x.id===t.athleteId),'finish')}</div>`:''}
   <div class="field"><label>¿Cómo te sentiste?</label><span class="stars" id="rateStars">${starsInter()}</span></div>
   <div class="field"><label>Comentario para tu coach</label><textarea id="fin_c" placeholder="Opcional" oninput="S.ui.finC=this.value">${esc(S.ui.finC||'')}</textarea></div>
   <button class="btn primary full" onclick="finishTraining('${t.id}')">${ic('check',15)} Marcar como completado</button></div>`;
}
function rpeField(){const e=S.ui.effort??7;return `<div class="field"><label>¿Qué tan duro fue? (RPE 0–10) ${qm('rpe')} · <span id="rpeLbl">${RPE_LBL[e]}</span></label><div class="range-row"><input type="range" min="0" max="10" value="${e}" oninput="S.ui.effort=+this.value;this.nextElementSibling.textContent=this.value+'/10';document.getElementById('rpeLbl').textContent=RPE_LBL[this.value];updLoadCalc()"><b>${e}/10</b></div><small>0 = sin esfuerzo · 10 = lo más duro posible</small></div>`}
function hrAvgField(){return `<div class="field" style="max-width:340px"><label>¿A cuántas pulsaciones por minuto estuviste en promedio? ${qm('lpm_avg')}</label><input type="number" id="fin_hr" min="40" max="230" placeholder="Ej. 135" value="${esc(S.ui.finHr||'')}" oninput="updLoadCalc()"><small id="fin_hrz"></small></div>`}
function zonesField(){const z=S.ui.finZ||[],k=karvonen(curA());return `<details ${z.some(v=>+v>0)||S.ui.hr?'open':''} ontoggle="S.ui.hr=this.open"><summary style="cursor:pointer;font-size:12px;font-weight:600;color:var(--green-d);margin-bottom:8px;display:flex;gap:4px;align-items:center">${ic('heart',13)} Minutos en cada zona de pulsaciones (opcional) ${qm('zonas')}</summary><div class="zones">${ZONES.map((q,i)=>`<div><label>${q[0]}<br>${k?`${k.z[i].lo}–${k.z[i].hi}`:q[1]}</label><input class="inp fin_z" type="number" min="0" placeholder="min" value="${esc(z[i]||'')}" oninput="updLoadCalc()"></div>`).join('')}</div><div style="height:12px"></div></details>`}
const ZNAME=['muy suave','suave','moderada','intensa','máxima'];
function zoneBtnsField(){const k=karvonen(curA()),z=S.ui.finZn||0;return `<div class="field" id="zoneBtns"><label>¿En qué zona de pulsaciones entrenaste la mayor parte del tiempo? ${qm('zonabtn')}</label><div class="zbtns">${[1,2,3,4,5].map(i=>`<button type="button" class="zbtn z${i} ${z===i?'on':''}" onclick="S.ui.finZn=S.ui.finZn===${i}?0:${i};refreshZoneBtns()">Z${i}<small>${k?`${k.z[i-1].lo}–${k.z[i-1].hi}`:ZNAME[i-1]}</small></button>`).join('')}</div><small>${z?`Zona ${z}: ${ZNAME[z-1]}`:'Toca una zona; si usas reloj puedes anotar abajo el promedio exacto.'}</small></div>`}
function refreshZoneBtns(){const el=document.getElementById('zoneBtns');if(el)el.outerHTML=zoneBtnsField();updLoadCalc()}
function updLoadCalc(){
  const m=document.getElementById('fin_min');if(!m)return;
  const min=+m.value||0,r=S.ui.effort??7,z=[...document.querySelectorAll('.fin_z')].map(i=>+i.value||0),hrEl=document.getElementById('fin_hr'),hr=hrEl?+hrEl.value||0:0,a=curA(),k=karvonen(a),zn=hrZone(a,hr);
  S.ui.finMin=min;S.ui.finZ=z;S.ui.finHr=hr||'';
  let tr=trimpOf(z),est=false;if(!tr&&zn){tr=min*zn;est=true}if(!tr&&S.ui.finZn){tr=min*S.ui.finZn;est=true}
  const zEl=document.getElementById('fin_hrz');
  if(zEl)zEl.innerHTML=!hr?(k?`Tus zonas: ${k.z.map((q,i)=>`Z${i+1} ${q.lo}–${q.hi}`).join(' · ')} lpm`:'Tu coach aún no registra tu edad o FC en reposo.'):!k?'Sin edad o FC en reposo no se puede calcular la zona.':zn?`Eso es tu <b>zona ${zn}</b> (${ZNAME[zn-1]}): ${k.z[zn-1].lo}–${k.z[zn-1].hi} lpm`:`Está por debajo de tu zona 1 (${k.z[0].lo} lpm).`;
  const el=document.getElementById('loadCalc');if(el)el.innerHTML=`Carga de la sesión: <b>${min} min × RPE ${r} = ${fmtN(min*r)} UA</b>${tr?` · TRIMP${est?' estimado':''} <b>${tr}</b>`:''}`;
}
function setKg(tid,key,v){const t=taskById(tid);t.progress.kg=t.progress.kg||{};if(v==='')delete t.progress.kg[key];else t.progress.kg[key]=+v;save()}
function starsInter(){const r=S.ui.rate||0;return [1,2,3,4,5].map(i=>`<button class="${i<=r?'on':''}" onclick="S.ui.rate=${i};document.getElementById('rateStars').innerHTML=starsInter()">★</button>`).join('')}

function openCoachTask(id){
  const t=taskById(id);if(!t)return;const T=TYPES[t.type],st=status(t);

  const t=taskById(id);if(!t)return;
  if(t.type==='video'){playVideo(t.data.url,t.title,t.id);return}

  if(S.ui.finTask!==id){S.ui.finTask=id;S.ui.finMin=null;S.ui.finZ=null;S.ui.finC='';S.ui.finHr='';S.ui.finZn=0;S.ui.rate=0}
  renderAthTaskModal(id);
}
function renderAthTaskModal(id){
  const t=taskById(id),T=TYPES[t.type],st=status(t);
  let foot='';
  if(t.status!=='done'){
    if(t.type==='nutricion') foot=`<button class="btn primary" onclick="markDone('${t.id}','revisó su plan de alimentación')">${ic('check',15)} Marcar como revisado</button>`;
    if(t.type==='documento') foot=`<button class="btn primary" onclick="markDone('${t.id}','leyó «${esc(t.title).replace(/'/g,'')}»')">${ic('check',15)} Marcar como leído</button>`;
    if(t.type==='sesion') foot=`<button class="btn primary" onclick="confirmSession('${t.id}')">${ic('check',15)} Confirmar asistencia</button>`;
    if(t.type==='evolucion') foot=`<button class="btn primary" onclick="saveEvoTask('${t.id}')">${ic('check',15)} Guardar registro</button>`;
    if(t.type==='formulario') foot=`<button class="btn primary" onclick="openFormFill('${t.id}',-1)">${ic('form',15)} Responder formulario</button>`;
  }
  openModal(`<div class="modal"><div class="modal-h"><h3><span style="color:${T.color};display:flex">${ic(T.icon,20)}</span>${esc(t.title)}</h3><span class="pill ${st}">${STATUS_LBL[st]}</span><button class="x" onclick="closeModal()">${ic('x',20)}</button></div>
  <div class="modal-b"><div class="muted" style="font-size:12px;margin-bottom:6px;text-transform:capitalize">${T.label} · ${longDate(t.date)}</div>${detailBody(t,'athlete')}</div>

function toggleSet(tid,key){
  const t=taskById(tid);t.progress=t.progress||{sets:{}};t.progress.sets[key]=!t.progress.sets[key];
  if(!S.ui.timer||S.ui.timer.taskId!==tid) S.ui.timer={taskId:tid,start:Date.now()};

  const sc=document.querySelector('#modalRoot .modal-b')?.scrollTop||0;

  const mb=document.querySelector('#modalRoot .modal-b');if(mb)mb.scrollTop=sc;
}
function startTimer(tid){S.ui.timer={taskId:tid,start:Date.now()};save();renderAthTaskModal(tid);toast('¡A entrenar! Cronómetro iniciado')}
function elapsed(start){const s=Math.floor((Date.now()-start)/1000);return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`}
function tick(){document.querySelectorAll('.live-timer').forEach(el=>el.textContent=elapsed(+el.dataset.start))}
setInterval(tick,1000);
function finishTraining(tid){
  const t=taskById(tid),p=pct(t),min=+gv('fin_min');
  if(!min){toast('Escribe cuántos minutos duró la sesión');return}
  if(p===0&&!confirm('No marcaste ninguna serie. ¿Finalizar de todos modos?'))return;
  const rpe=S.ui.effort??7,zones=[...document.querySelectorAll('.fin_z')].map(i=>+i.value||0);
  const dur=`${min} min`;
  const cpF=genderOf(S.athletes.find(x=>x.id===t.athleteId))==='Mujer'?cyclePhase(cycleOf(t.athleteId)):null;
  t.status='done';t.feedback={period:cpF&&cpF.menstrual?cpF.day:null,effort:rpe,durMin:min,zones:trimpOf(zones)?zones:null,hrAvg:+gv('fin_hr')||null,zoneMain:S.ui.finZn||null,rating:S.ui.rate||0,comment:gv('fin_c'),duration:dur,completedAt:Date.now()};
  S.ui.timer=null;S.ui.rate=0;S.ui.effort=7;S.ui.finMin=null;S.ui.finZ=null;S.ui.finC='';S.ui.finHr='';
  pushActivity(t.athleteId,'done',`completó «${t.title}» (${p}%) · carga ${fmtN(min*rpe)} UA${cpF&&cpF.menstrual?` · día ${cpF.day} de periodo`:''}`);
  closeModal();commit();toast(`¡Entrenamiento completado! Carga de la sesión: ${fmtN(min*rpe)} UA`);
}
function markDone(tid,txt){const t=taskById(tid);t.status='done';pushActivity(t.athleteId,'done',txt);closeModal();commit();toast('Listo, tu coach fue notificado')}
function confirmSession(tid){const t=taskById(tid);t.confirmed=true;t.status='done';pushActivity(t.athleteId,'done',`confirmó asistencia a «${t.title}» (${t.data.time})`);closeModal();commit();toast('Asistencia confirmada')}
function saveEvoTask(tid){
  const t=taskById(tid),r={};let ok=false;
  t.data.metrics.forEach(m=>{const v=parseFloat(gv('ev_'+m));if(!isNaN(v)){r[m]=v;ok=true}});
  if(!ok){toast('Escribe al menos una medida');return}
  t.result=r;t.status='done';
  S.evo.push({id:uid(),athleteId:t.athleteId,date:t.date,...r});
  pushActivity(t.athleteId,'evo',`registró su evolución${r.peso?`: ${r.peso} kg`:''}`);
  closeModal();commit();toast('Registro guardado');
}

/* =========================================================
   CHAT
========================================================= */
function chatItems(aid){
  const m=S.messages.filter(x=>x.athleteId===aid).map(x=>({...x}));
  S.tasks.filter(t=>t.athleteId===aid&&t.type==='mensaje'&&t.date<=TODAY).forEach(t=>{const [h,mi]=(t.data.time||'07:00').split(':').map(Number);const d=parse(t.date);d.setHours(h,mi);m.push({from:'coach',text:t.data.text,ts:d.getTime(),sched:true})});
  return m.sort((a,b)=>a.ts-b.ts);
}
function chatHTML(aid,role){
  const items=chatItems(aid);
  return `<div class="chat"><div class="chat-list">${items.length?items.map(x=>{const mine=x.from===role;return `<div class="msg ${mine?'me':'them'}">${x.sched?`<div class="sch">${ic('clock',11)} Mensaje programado</div>`:''}${esc(x.text)}<div class="t">${new Date(x.ts).toLocaleDateString('es-MX',{day:'2-digit',month:'short'})} · ${hhmm(x.ts)}</div></div>`}).join(''):'<div class="empty-state">Empieza la conversación</div>'}</div>

function sendMsg(role){
  const el=document.getElementById('chat_'+role),txt=el?el.value.trim():'';if(!txt)return;
  const aid=S.ui.athleteId;
  S.messages.push({id:uid(),athleteId:aid,from:role,text:txt,ts:Date.now(),seen:role==='athlete'});
  if(role==='athlete') pushActivity(aid,'msg','te envió un mensaje');
  commit();

  if(role==='athlete'&&S.ui.coachTab==='msgs'){S.activity.forEach(x=>{if(x.athleteId===aid&&x.kind==='msg')x.read=true});save();renderApp()}

/* =========================================================
   EVOLUCIÓN
========================================================= */
function evoHTML(aid,role){
  const es=S.evo.filter(e=>e.athleteId===aid&&!e.kind).sort((a,b)=>a.date.localeCompare(b.date));
  const w=es.filter(e=>e.peso!=null);
  let chart='<div class="empty-state">Aún no hay registros de peso</div>';
  if(w.length){
    const W=560,H=170,pd=28,vals=w.map(e=>e.peso),mn=Math.min(...vals)-.5,mx=Math.max(...vals)+.5;
    const X=i=>pd+(w.length===1?(W-2*pd)/2:i*(W-2*pd)/(w.length-1)),Y=v=>H-pd-(v-mn)/(mx-mn)*(H-2*pd);
    const pts=w.map((e,i)=>`${X(i)},${Y(e.peso)}`).join(' ');
    chart=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      <defs><linearGradient id="g_${role}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#16a34a" stop-opacity=".25"/><stop offset="1" stop-color="#16a34a" stop-opacity="0"/></linearGradient></defs>

/* ---------- plantillas y creador de planes ---------- */
/* =========================================================
   TIPOS DE SERIE · BOTONES +/− · UNIDAD kg/lb · EXCEL
   - Un ejercicio con link=true se hace seguido del siguiente (mismo bloque/categoría).
   - 2 ejercicios = Biserie (o Superserie), 3 = Triserie, 4 o más = Megaserie.
   - drop=true marca dropset en ese ejercicio. unit = 'kg' | 'lb'.
========================================================= */
const GSIZE={Biserie:2,Superserie:2,Triserie:3,Megaserie:4};
const TYPE_LIST=['Aislado','Biserie','Triserie','Superserie','Megaserie','Dropset'];
const TYPE_TIP={
  Aislado:'Un ejercicio a la vez: terminas sus series con su descanso y pasas al siguiente.',
  Dropset:'En la última serie, al llegar al fallo baja el peso 20–30 % y sigue sin descansar (1 o 2 bajadas).',
  Biserie:'Dos ejercicios seguidos sin descanso entre ellos. Descansas al terminar los dos.',
  Triserie:'Tres ejercicios seguidos sin descanso entre ellos. Descansas al terminar los tres.',
  Superserie:'Dos ejercicios de músculos opuestos (ej. bíceps y tríceps) seguidos sin descanso.',
  Megaserie:'Cuatro o más ejercicios seguidos sin descanso, como un circuito. Descansas al terminar la vuelta.'};
function gKind(n,g){return n<2?'':n===2?(g==='Superserie'?'Superserie':'Biserie'):n===3?'Triserie':'Megaserie'}
function exGroups(list,cnt){
  cnt=cnt||{L:0,k:0};const out=[];let i=0;
  while(i<list.length){let j=i;while(j<list.length-1&&list[j]&&list[j].link&&(list[j].cat||'')===(list[j+1].cat||''))j++;
    const n=j-i+1,g={s:i,e:j,n,kind:n>1?gKind(n,list[i].gtype):(list[i].drop?'Dropset':'Aislado'),L:n>1?String.fromCharCode(65+(cnt.L++)%26):'',lab:[]};
    for(let x=i;x<=j;x++)g.lab.push(n>1?g.L+(x-i+1):String(++cnt.k));
    out.push(g);i=j+1}
  return out;
}
function setExType(list,i,type,mk){
  const g=exGroups(list).find(g=>i>=g.s&&i<=g.e);
  if(type==='Aislado'){
    if(g.n>1){if(i>g.s)list[i-1].link=false;if(i===g.s&&list[i+1]&&i+1<=g.e)list[i+1].gtype=list[i].gtype;list[i].link=false;list[i].gtype=''}
    else list[i].drop=false;
    return;
  }
  const s=g.n>1?g.s:i,n=GSIZE[type];
  for(let x=g.s;x<=g.e;x++){list[x].link=false;if(x!==s)list[x].gtype=''}
  for(let k=s+1;k<s+n;k++)if(!list[k])list.splice(k,0,mk(list[s]));
  for(let x=s;x<s+n;x++){list[x].link=x<s+n-1;if(list[s].cat!=null)list[x].cat=list[s].cat}
  list[s].gtype=type==='Superserie'?'Superserie':'';
}
function exRemove(list,i){const e=list[i];if(!e)return;const start=i===0||!list[i-1].link;if(i>0&&list[i-1].link&&!e.link)list[i-1].link=false;if(start&&e.link&&list[i+1])list[i+1].gtype=e.gtype||'';list.splice(i,1)}
const exMk=(mode,ref)=>mode==='p'?{...emptyRow(),cat:ref&&ref.cat?ref.cat:'Principal'}:{name:'',sets:'',reps:'',rest:'',tempo:'',rir:'',video:'',unit:'kg'};
function exCollect(mode,a){if(mode==='p'){collectPlan();return S.ui.pd.days[S.ui.pday].rows}collectDraft();return S.ui.draft.blocks[a].exercises}
function exRerender(mode){const mb=document.querySelector('#modalRoot .modal-b'),sc=mb?mb.scrollTop:0;if(mode==='p')renderPlanEditor();else rerenderBuilder();const nb=document.querySelector('#modalRoot .modal-b');if(nb)nb.scrollTop=sc}
function exType(mode,a,i,t){
  const list=exCollect(mode,a),g=exGroups(list).find(g=>i>=g.s&&i<=g.e);
  if(t==='Dropset')list[i].drop=!list[i].drop;
  else if(GSIZE[t]&&g.n>1&&g.kind===t){}
  else setExType(list,i,t,ref=>exMk(mode,ref));
  exRerender(mode);
}
function exGrpAdd(mode,a,e){const list=exCollect(mode,a);list.splice(e+1,0,exMk(mode,list[e]));list[e].link=true;list[e+1].link=false;exRerender(mode)}
function exUngroup(mode,a,s){const list=exCollect(mode,a),g=exGroups(list).find(g=>g.s===s);if(g)for(let x=g.s;x<=g.e;x++){list[x].link=false;list[x].gtype=''}exRerender(mode)}
function exUnit(mode,a,i,u){const list=exCollect(mode,a);list[i].unit=u;exRerender(mode)}
function exMove(mode,a,i,d){const list=exCollect(mode,a),j=i+d;if(j<0||j>=list.length)return;const A=list[i],B=list[j],la=[A.link,A.gtype],lb=[B.link,B.gtype];
  list[i]=B;list[j]=A;[list[i].link,list[i].gtype]=la;[list[j].link,list[j].gtype]=lb;if(mode==='p'&&A.cat!==B.cat){const c=A.cat;A.cat=B.cat;B.cat=c}exRerender(mode)}
function exCat(i,v){const list=exCollect('p',S.ui.pday),g=exGroups(list).find(g=>i>=g.s&&i<=g.e);for(let x=g.s;x<=g.e;x++)list[x].cat=v;exRerender('p')}

const TEMPOS=['','2-0-1-0','2-0-2-0','3-0-1-0','3-1-1-0','4-0-1-0','2-1-1-1','3-0-1-1','4-1-1-0','X-0-X-0'];
function restSec(v){v=String(v||'').trim();if(!v)return null;let m=v.match(/^(\d+)\s*[:']\s*(\d{1,2})/);if(m)return +m[1]*60+ +m[2];m=v.match(/^(\d+(?:\.\d+)?)\s*(min|m\b|')/i);if(m)return Math.round(+m[1]*60);m=v.match(/^(\d+)/);return m?+m[1]:null}
function fmtRest(s){return s<=90?`${s} s`:s%60?`${Math.floor(s/60)}:${pad(s%60)} min`:`${s/60} min`}
function stepVal(k,v,d){
  v=String(v??'').trim();const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
  if(k==='sets'){if(!v)return d>0?'3':'';const n=(parseInt(v)||0)+d;return n<1?'':String(Math.min(20,n))}
  if(k==='reps'){if(!v)return '10';return /\d/.test(v)?v.replace(/\d+/g,m=>String(Math.max(1,+m+d))):v}
  if(k==='rir'){if(!v)return '2';return /\d/.test(v)?v.replace(/\d+/g,m=>String(cl(+m+d,0,10))):v}
  if(k==='rest'){const s=restSec(v);return fmtRest(s==null?60:cl(s+15*d,0,600))}
  if(k==='tempo'){const i=TEMPOS.indexOf(v);return TEMPOS[((i<0?0:i)+d+TEMPOS.length)%TEMPOS.length]}
  return v;
}
function stp(k,attr,val,ph,cls){return `<span class="stp ${cls||''}" data-k="${k}"><button type="button" tabindex="-1" aria-label="Menos" onclick="stpGo(this,-1)">−</button><input ${attr} value="${esc(val??'')}" placeholder="${ph||''}" inputmode="${k==='sets'||k==='rir'?'numeric':'text'}"><button type="button" tabindex="-1" aria-label="Más" onclick="stpGo(this,1)">+</button></span>`}

function parseTrainingWorkbook(wb,fname){
  const X=XLSX.utils,plan={id:null,name:'',src:'',desc:'',wpp:2,days:[]};let wppSet=false;
  const TYPE_ALIAS=v=>String(v||'').toLowerCase().replace(/super ?set/g,'superserie').replace(/giant ?set|mega ?set|mega ?serie|\bmega\b/g,'megaserie').replace(/bi[ -]?serie|bi[ -]?set/g,'biserie').replace(/tri[ -]?serie|tri[ -]?set/g,'triserie');
  wb.SheetNames.forEach(sn=>{
    const ws=wb.Sheets[sn];if(!ws||!ws['!ref'])return;const R=X.decode_range(ws['!ref']);
    const cell=(r,c)=>c==null?null:ws[X.encode_cell({r,c})],txt=(r,c)=>{const v=cell(r,c);return v?String(v.w!=null?v.w:v.v).trim():''};
    let hr=-1;for(let r=R.s.r;r<=Math.min(R.e.r,20)&&hr<0;r++)for(let c=R.s.c;c<=Math.min(R.e.c,30);c++)if(/^ejercicio$/i.test(txt(r,c))){hr=r;break}
    if(hr<0){if(/instruc|nutri|aliment|cliente|atleta/i.test(sn))return;for(let r=R.s.r;r<=Math.min(R.e.r,30);r++){const k=txt(r,0).toLowerCase(),v=txt(r,1);if(!v)continue;if(/nombre/.test(k))plan.name=v;else if(/objetivo|nota/.test(k))plan.desc=v;else if(/semana/.test(k)&&parseInt(v)){plan.wpp=Math.max(1,Math.min(4,parseInt(v)));wppSet=true}}return}
    if(/nutri|instruc|cliente/i.test(sn))return;
    const col={ph:[[null,null],[null,null],[null,null],[null,null]]};
    for(let c=R.s.c;c<=Math.min(R.e.c,30);c++){const h=txt(hr,c).toLowerCase().replace(/\s+/g,' ');let m;if(!h)continue;
      if((m=h.match(/^(?:f|fase)\s*([1-4]).*serie/)))col.ph[m[1]-1][0]=c;
      else if((m=h.match(/^(?:f|fase)\s*([1-4]).*rep/)))col.ph[m[1]-1][1]=c;
      else if(/^series?$/.test(h))col.sets=c;else if(/^reps?$|repetici/.test(h))col.reps=c;
      else if(/grupo|categor/.test(h))col.cat=c;else if(/combin/.test(h))col.combo=c;else if(/^tipo/.test(h))col.type=c;
      else if(/^ejercicio$/.test(h))col.name=c;else if(/tempo/.test(h))col.tempo=c;else if(/^rir/.test(h))col.rir=c;
      else if(/desc|rest/.test(h))col.rest=c;else if(/unidad|unit/.test(h))col.unit=c;else if(/video|link/.test(h))col.video=c}
    const na=v=>/^(na|n\/a|-|—|–)$/i.test(v)?'':v,rows=[];let lastCat='Principal';
    for(let r=hr+1;r<=R.e.r;r++){
      const name=txt(r,col.name);if(!name)continue;if(/^total$/i.test(name))break;
      const cv=txt(r,col.cat).toLowerCase(),cat=/rezag|activ/.test(cv)?CATS[0]:/complem|acces/.test(cv)?CATS[2]:/princ/.test(cv)?CATS[1]:lastCat;lastCat=cat;
      const ph=[0,1,2,3].map(f=>{const sc=col.ph[f][0]!=null?col.ph[f][0]:col.sets,rc=col.ph[f][1]!=null?col.ph[f][1]:col.reps,s=na(txt(r,sc)),rp=na(txt(r,rc));return s?[s,rp]:null});
      const tv=TYPE_ALIAS(txt(r,col.type)),vc=cell(r,col.video);
      rows.push({name,cat,ph,tempo:na(txt(r,col.tempo)),rir:na(txt(r,col.rir)),rest:na(txt(r,col.rest)),video:vc?String((vc.l&&vc.l.Target)||vc.v||'').trim():'',unit:/lb|libra/i.test(txt(r,col.unit))?'lb':'kg',link:false,gtype:'',drop:/drop/.test(tv),_c:txt(r,col.combo).toUpperCase(),_t:Object.keys(GSIZE).find(k=>tv.includes(k.toLowerCase()))||''});
    }
    if(!rows.length)return;
    rows.forEach((x,i)=>{const y=rows[i+1];if(x._c&&y&&y._c===x._c&&y.cat===x.cat)x.link=true});
    exGroups(rows).forEach(g=>{if(g.n>1&&rows.slice(g.s,g.e+1).some(x=>x._t==='Superserie'))rows[g.s].gtype='Superserie'});
    for(let i=0;i<rows.length;i++){const g=exGroups(rows).find(g=>i>=g.s&&i<=g.e);if(g.n===1&&rows[i]._t&&!rows[i]._c){setExType(rows,i,rows[i]._t,ref=>({...emptyRow(),cat:ref.cat}))}}
    rows.forEach(x=>{delete x._c;delete x._t});
    plan.days.push({name:sn.trim(),rows});
  });
  if(!plan.days.length)throw new Error('No encontré hojas con la columna «Ejercicio». Usa la plantilla de Excel.');
  if(!plan.name)plan.name=String(fname||'Plan').replace(/\.xlsx?$/i,'').replace(/[-_]+/g,' ').trim();
  plan.wppSet=wppSet;return plan;
}

async function isExcelFile(file){
  if(!file||!/\.(xlsx|xls)$/i.test(file.name))return false;
  try{const b=new Uint8Array(await file.slice(0,8).arrayBuffer());
    const zip=b[0]===0x50&&b[1]===0x4b&&b[2]===0x03&&b[3]===0x04,ole=b[0]===0xd0&&b[1]===0xcf&&b[2]===0x11&&b[3]===0xe0;return zip||ole}catch(e){return false}
}
function parseClientExtras(wb){

  if(!p.name){toast('Ponle nombre al plan');return}
  const days=p.days.map(d=>({...d,rows:d.rows.filter(r=>r.name.trim())})).filter(d=>d.rows.length);
  if(!days.length){toast('Agrega al menos un ejercicio');return}
  if(days.some(d=>d.rows.some(r=>r.video&&!vInfo(r.video)))){toast('Hay un link de video que no es válido');return}
  p.days=days;
  let added=0;p.days.forEach(d=>d.rows.forEach(r=>{const ex=libFind(r.name);if(!ex){S.library.push({id:uid(),name:r.name.trim(),group:guessGroup(d.name),type:'Hipertrofia',video:r.video||'',notes:'',src:['Coach']});added++}else if(r.video&&!ex.video)ex.video=r.video}));
  const orig=p.id?S.plans.find(x=>x.id===p.id):null,apply=p.id&&S.ui.pdApply!==false;
  if(p.id){S.plans[S.plans.findIndex(x=>x.id===p.id)]=p}else{p.id=uid();S.plans.push(p)}
  const upd=apply?refreshPlanTasks(p,orig):0;
  if(p.athleteId){const ath=S.athletes.find(x=>x.id===p.athleteId);if(ath)ath.plan={...JSON.parse(JSON.stringify(p)),tplId:p.id,phase:ath.plan?(ath.plan.phase??0):0}}
  S.ui.section='plantillas';closeModal();commit();toast(`Plantilla guardada${upd?` · ${upd} sesiones actualizadas`:''}${added?` · ${added} ejercicio(s) nuevos en la biblioteca`:''}`);
  if(assign)openAssignPlan(p.id);
}
const nextMonday=()=>{const m=mondayOf(TODAY);return m===TODAY?TODAY:addDays(m,7)};
function openAssignPlan(pid,start){
  const p=S.plans.find(x=>x.id===pid);if(!p)return;
  S.ui.ap={pid,start:start&&start>=TODAY?start:nextMonday(),wpp:p.wpp||2,map:p.days.map((_,i)=>i<6?i:-1),aid:S.ui.athleteId};
  renderAssignPlan();
}
function planSchedule(p,ap){
  const out=[],mon=mondayOf(ap.start);
  for(let w=0;w<4*ap.wpp;w++){const ph=Math.floor(w/ap.wpp);p.days.forEach((d,i)=>{const k=ap.map[i];if(k<0)return;const ds=addDays(mon,w*7+k);if(ds<ap.start)return;out.push({date:ds,day:i,phase:ph,week:w})})}
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

    <div class="note">${dates.length?`Se crearán <b>${dates.length} entrenamientos</b> del ${dmy(dates[0].date)} al ${dmy(dates[dates.length-1].date)}.<br>${ph.map((x,f)=>x.length?`Fase ${f+1}: ${dmy(x[0].date).slice(0,5)} – ${dmy(x[x.length-1].date).slice(0,5)}`:'').filter(Boolean).join(' · ')}`:'Elige al menos un día de la semana.'}</div>

function apSync(){const ap=S.ui.ap;ap.start=gv('ap_s')||ap.start;if(ap.start<TODAY)ap.start=TODAY;ap.wpp=+gv('ap_w');ap.aid=gv('ap_a');document.querySelectorAll('.ap_m').forEach(el=>ap.map[+el.dataset.i]=+el.value);renderAssignPlan()}
function dayToBlocks(d,phase){
  return CATS.map(c=>{const all=d.rows.filter(r=>(CATS.includes(r.cat)?r.cat:'Principal')===c);
    return {name:c,exercises:all.map((r,i)=>r.ph[phase]?{name:r.name,sets:String(r.ph[phase][0]),reps:String(r.ph[phase][1]??''),rest:r.rest||'',tempo:r.tempo||'',rir:r.rir??'',video:r.video||(typeof S!=='undefined'&&S&&S.library?(libFind(r.name)?.video||''):''),link:!!(r.link&&all[i+1]&&all[i+1].ph[phase]),gtype:r.gtype||'',drop:!!r.drop,unit:r.unit||'kg'}:null).filter(Boolean)}}).filter(b=>b.exercises.length);

function assignPlan(){
  const ap=S.ui.ap,p=S.plans.find(x=>x.id===ap.pid),aid=ap.aid,dates=planSchedule(p,ap);
  if(!dates.length){toast('Elige al menos un día');return}

  S.ui.athleteId=aid;S.ui.section='clientes';S.ui.coachTab='plan';S.ui.month=dates[0].date.slice(0,7);S.ui.selDay=dates[0].date;S.ui.athTab='agenda';
  closeModal();commit();toast(`${dates.length} entrenamientos asignados a ${S.athletes.find(a=>a.id===aid).name}`);
}

/* =========================================================
   CARGA DE ENTRENAMIENTO · sRPE, ACWR, TRIMP, volumen
========================================================= */
const repsNum=r=>{const m=String(r||'').match(/\d+/);return m?+m[0]:0};
const fmtN=v=>Math.round(v||0).toLocaleString('es-MX');
function trimpOf(z){if(!z||!z.some(v=>+v>0))return null;return z.reduce((s,v,i)=>s+(+v||0)*(i+1),0)}
function volOf(t){let v=0;(t.data.blocks||[]).forEach((b,bi)=>b.exercises.forEach((e,ei)=>{const kg=toKg(+(t.progress?.kg?.[`${bi}-${ei}`])||0,wUnit(t,`${bi}-${ei}`,e));if(!kg)return;const n=Math.max(1,parseInt(e.sets)||1);let d=0;for(let s=0;s<n;s++)if(t.progress?.sets?.[`${bi}-${ei}-${s}`])d++;v+=d*repsNum(e.reps)*kg}));return Math.round(v)}
function karvonen(a){if(!a||!+a.age||!+a.hrRest)return null;const max=220-(+a.age),rest=+a.hrRest,res=max-rest;if(res<=0)return null;return {max,rest,res,z:ZONES.map((q,i)=>{const plo=0.5+i*0.1,phi=plo+0.1;return {plo,phi,lo:Math.round(rest+res*plo),hi:Math.round(rest+res*phi)-(i<4?1:0)}})}}
function hrZone(a,bpm){const k=karvonen(a);if(!k||!bpm)return null;for(let i=4;i>=0;i--)if(bpm>=k.z[i].lo)return i+1;return 0}
function sessTrimp(f,a){if(!f)return null;const t=trimpOf(f.zones);if(t)return t;const z=hrZone(a,+f.hrAvg)||+f.zoneMain;return z?(+f.durMin||0)*z:null}
function sessionsOf(aid){
  const a=S.athletes.find(x=>x.id===aid),out=[];
  const tt=(f,min)=>{const z=f.zones,t=trimpOf(z);if(t)return {v:t,txt:`${z.map((m,i)=>`${m}×${i+1}`).join(' + ')} = ${t}`};const zn=hrZone(a,+f.hrAvg);if(zn)return {v:min*zn,txt:`${min} min × Z${zn} (${f.hrAvg} lpm) = ${min*zn} (est.)`};if(+f.zoneMain)return {v:min*f.zoneMain,txt:`${min} min × Z${f.zoneMain} (zona marcada) = ${min*f.zoneMain} (est.)`};return {v:null,txt:''}};
  S.tasks.forEach(t=>{if(t.athleteId!==aid||t.type!=='entrenamiento'||t.status!=='done'||!t.feedback)return;const f=t.feedback,min=+f.durMin||0,rpe=+f.effort||0,T=tt(f,min);out.push({date:t.date,title:t.title,kind:'Fuerza',min,rpe,load:min*rpe,trimp:T.v,trimpTxt:T.txt,vol:volOf(t),ready:t.readiness?t.readiness.score:null,rd:t.readiness||null,hr:+f.hrAvg||null,zones:f.zones||null,zm:hrZone(a,+f.hrAvg)||+f.zoneMain||null})});
  S.acts.forEach(x=>{if(x.athleteId!==aid)return;const T=tt(x,+x.durMin);out.push({date:x.date,title:x.kind,kind:'Actividad',min:+x.durMin,rpe:+x.rpe,load:x.durMin*x.rpe,trimp:T.v,trimpTxt:T.txt,vol:0,ready:null,rd:null,hr:+x.hrAvg||null,zones:x.zones||null,zm:hrZone(a,+x.hrAvg)||+x.zoneMain||null})});
  return out.sort((p,q)=>p.date.localeCompare(q.date));
}
function volRows(t){const out=[];(t.data.blocks||[]).forEach((b,bi)=>b.exercises.forEach((e,ei)=>{const raw=+(t.progress?.kg?.[`${bi}-${ei}`])||0,un=wUnit(t,`${bi}-${ei}`,e),kg=Math.round(toKg(raw,un)*10)/10;if(!kg)return;const n=Math.max(1,parseInt(e.sets)||1);let d=0;for(let s=0;s<n;s++)if(t.progress?.sets?.[`${bi}-${ei}-${s}`])d++;const reps=repsNum(e.reps);out.push({name:e.name,d,reps,kg,wt:un==='lb'?`${raw} lb (${kg} kg)`:`${kg} kg`,v:Math.round(d*reps*kg)})}));return out}
function calcData(aid){
  const a=S.athletes.find(x=>x.id===aid),st=loadStats(aid);
  const last7=[...Array(7)].map((_,i)=>addDays(TODAY,i-6)).map(ds=>({ds,v:st.daily[ds]||0}));
  const blocks=[0,1,2,3].map(w=>{let s=0;for(let i=w*7;i<w*7+7;i++)s+=st.daily[addDays(TODAY,-i)]||0;return s});
  const wk=weekly(aid,8),lw=wk[wk.length-2],lwDays=[...Array(7)].map((_,i)=>st.daily[addDays(lw.ws,i)]||0);
  return {a,st,last7,blocks,lw,lwDays,s7:st.ss.filter(s=>s.date>addDays(TODAY,-7)),k:karvonen(a)};
}
function calcHTML(key,aid){

  case 'c_acwr':return {t:'ACWR · relación aguda : crónica',b:`Compara la última semana contra el promedio del mes. Objetivo 0.8–1.3; arriba de 1.5 es riesgo alto; abajo de 0.8 es subcarga.<div class="f">${n(st.acute)} ÷ ${n(st.chronic)} = ${st.acwr!=null?st.acwr.toFixed(2):'—'}</div>Resultado: <b>${acwrZone(st.acwr).lbl}</b>`};

  case 'c_mono':{const l=d.lw,mean=l.load/7,sd=l.mono?mean/l.mono:0;return {t:'Monotonía y tensión · semana pasada',b:`Monotonía = promedio diario ÷ desviación estándar de los 7 días (más de 2 = días muy parecidos). Tensión = carga semanal × monotonía.<div class="f">Días L→D: ${d.lwDays.map(n).join(' · ')}\nPromedio = ${n(l.load)} ÷ 7 = ${mean.toFixed(1)}\nDesv. estándar = ${sd.toFixed(1)}\nMonotonía = ${mean.toFixed(1)} ÷ ${sd.toFixed(1)} = ${l.mono?l.mono.toFixed(2):'—'}\nTensión = ${n(l.load)} × ${l.mono?l.mono.toFixed(2):'—'} = ${l.strain?n(l.strain):'—'}</div>`}}
  case 'c_vol':{const t=S.tasks.filter(x=>x.athleteId===aid&&x.type==='entrenamiento'&&x.status==='done'&&volOf(x)).sort((x,y)=>y.date.localeCompare(x.date))[0];if(!t)return {t:'Volumen levantado',b:'Series completadas × repeticiones × kg (lo que se anota en lb se convierte a kg). Aún no hay pesos registrados.'};const rows=volRows(t);return {t:'Volumen levantado',b:`Series completadas × repeticiones × kg, sumado por sesión y por semana. Última sesión con pesos (${dmy(t.date).slice(0,5)} · ${esc(t.title)}):<div class="f">${rows.slice(0,6).map(r=>`${esc(r.name.slice(0,26))}: ${r.d} × ${r.reps} × ${r.wt} = ${n(r.v)}`).join('\n')}${rows.length>6?`\n… ${rows.length-6} ejercicios más`:''}\nTotal de la sesión = ${n(volOf(t))} kg</div>`}}
  case 'c_karv':{const k=d.k,a=d.a;if(!k)return {t:'Zonas de FC · Karvonen',b:'Faltan la edad o la FC en reposo del atleta. Agrégalas en su perfil.'};return {t:'Zonas de FC · Karvonen',b:`FC máx = 220 − edad. FC de reserva = FC máx − FC en reposo. Cada zona = FC reposo + FC reserva × % de intensidad.<div class="f">FC máx = 220 − ${a.age} = ${k.max} lpm\nFC reserva = ${k.max} − ${k.rest} = ${k.res} lpm\n${k.z.map((z,i)=>`Z${i+1} ${Math.round(z.plo*100)}–${Math.round(z.phi*100)}%: ${k.rest} + ${k.res}×${z.plo.toFixed(1)} = ${z.lo} → ${z.hi} lpm`).join('\n')}</div>`}}
  case 'c_semaforo':{const t=trafficDay(tlCtx(aid),TODAY);return {t:'Semáforo diario · algoritmo',b:`Cada día se revisan los últimos 7 días con 5 factores. Cada uno suma 0 (bien), 1 (vigilar) o 2 (alerta):<div class="f">ACWR: 0.8–1.3 → 0 · 0.6–0.8 o 1.3–1.5 → 1 · &lt;0.6 o &gt;1.5 → 2

IMM = ${c.mm?'masa muscular':'masa libre de grasa'} ÷ estatura² ${c.imm?`= ${c.imm.toFixed(1)} kg/m²`:''}
GEB = ${c.gebSrc||'—'}${c.geb?` = ${fmtN(c.geb)} kcal`:''}
  · Katch-McArdle: 370 + 21.6 × masa libre de grasa
  · Mifflin-St Jeor: 10×peso + 6.25×estatura − 5×edad (+5 hombre / −161 mujer)
GET = GEB × factor de actividad ${c.get?`= ${fmtN(c.geb)} × ${c.act} = ${fmtN(c.get)} kcal`:''}</div>`}}

  }
}

function nutDel(i){const a=nutCollect();a.nutrition.meals.splice(i,1);openNutrition(a.id)}
function nutSave(){const a=nutCollect();a.nutrition.kcalTarget=a.nutrition.kcalTarget||a.nutrition.meals.reduce((s,m)=>s+(m.kcal||0),0)||null;pushNotif(a.id,'Tu coach actualizó tu plan de alimentación');commit();openNutrition(a.id);toast('Plan de alimentación guardado')}

/* =========================================================
   ESTADÍSTICAS POR PERIODO (diario · semanal · mensual)
========================================================= */
function periodBuckets(aid,per){
  const a=S.athletes.find(x=>x.id===aid),ss=sessionsOf(aid),B=[];
  if(per==='d'){for(let i=13;i>=0;i--){const d=addDays(TODAY,-i);B.push({from:d,to:d,label:`${parse(d).getDate()}`,long:longDate(d),cur:i===0})}}
  else if(per==='w'){const mon=mondayOf(TODAY);for(let i=7;i>=0;i--){const f=addDays(mon,-7*i);B.push({from:f,to:addDays(f,6),label:`${parse(f).getDate()} ${MES[parse(f).getMonth()].slice(0,3)}`,long:`semana del ${dmy(f).slice(0,5)} al ${dmy(addDays(f,6)).slice(0,5)}`,cur:i===0})}}
  else{const t=parse(TODAY);for(let i=5;i>=0;i--){const d=new Date(t.getFullYear(),t.getMonth()-i,1),e=new Date(d.getFullYear(),d.getMonth()+1,0);B.push({from:fmt(d),to:fmt(e),label:MES[d.getMonth()].slice(0,3),long:`${MES[d.getMonth()]} ${d.getFullYear()}`,cur:i===0})}}
  const k=karvonen(a);
  B.forEach(b=>{const s=ss.filter(x=>x.date>=b.from&&x.date<=b.to);b.n=s.length;b.min=s.reduce((p,x)=>p+x.min,0);b.load=s.reduce((p,x)=>p+x.load,0);b.trimp=s.reduce((p,x)=>p+(x.trimp||0),0);b.vol=s.reduce((p,x)=>p+(x.vol||0),0);
    const hs=s.filter(x=>x.hr);b.hr=hs.length?Math.round(hs.reduce((p,x)=>p+x.hr,0)/hs.length):null;
    b.zones=[0,0,0,0,0];s.forEach(x=>{if(x.zones&&x.zones.some(v=>+v>0))x.zones.forEach((v,i)=>b.zones[i]+=+v||0);else if(x.zm)b.zones[x.zm-1]+=x.min});
    const rd=s.filter(x=>x.ready!=null);b.ready=rd.length?rd.reduce((p,x)=>p+x.ready,0)/rd.length:null;
    const ml=S.evo.filter(e=>e.kind==='meal'&&e.athleteId===aid&&e.date>=b.from&&e.date<=b.to);b.meals=ml.length;b.mealOk=ml.filter(x=>x.status==='ok').length;b.mealVar=ml.filter(x=>x.status==='var').length;b.mealSkip=ml.filter(x=>x.status==='skip').length});
  return {B,k};
}
function periodHTML(aid,role){
  const per=S.ui.per||'w',{B,k}=periodBuckets(aid,per),c=B[B.length-1],p=B[B.length-2]||{};
  const dl=(a,b)=>{if(!b||!a)return '';const d=Math.round((a-b)/b*100);return d?`<span class="delta ${d>0?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d)}%</span>`:''};
  const tiles=[['Sesiones',c.n,'',dl(c.n,p.n)],['Minutos',fmtN(c.min),'min',dl(c.min,p.min)],['Carga',fmtN(c.load),'UA',dl(c.load,p.load)],['TRIMP',c.trimp?fmtN(c.trimp):'—','',dl(c.trimp,p.trimp)],['Volumen',c.vol?fmtN(c.vol):'—','kg',dl(c.vol,p.vol)],['FC promedio',c.hr||'—',c.hr?'lpm':'',''],['Disposición',c.ready!=null?c.ready.toFixed(1):'—',c.ready!=null?'/10':'',''],['Alimentación',c.meals?Math.round(c.mealOk/c.meals*100)+'%':'—',c.meals?'según el plan':'','']];
  const zt=c.zones.reduce((a,b)=>a+b,0),ZC=['#60a5fa','#22c55e','#eab308','#f97316','#ef4444'];
  return `<div class="card" style="padding:14px;margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px"><b>${role==='coach'?'Resumen por periodo':'Mi resumen'}</b>${qm('periodo')}<span class="muted" style="font-size:12px;margin-left:auto">${esc(c.long)}</span></div>
    <div class="perseg">${[['d','Diario'],['w','Semanal'],['m','Mensual']].map(([v,l])=>`<button class="${per===v?'on':''}" onclick="S.ui.per='${v}';renderApp()">${l}</button>`).join('')}</div>
    <div class="tiles" style="margin-bottom:10px">${tiles.map(([l,v,u,d])=>`<div class="tile" style="background:var(--bg);border-radius:12px;padding:10px 12px"><div class="l">${l}</div><div class="v" style="font-size:20px">${v}${u?` <small>${u}</small>`:''}</div><div class="s">${d||'&nbsp;'}</div></div>`).join('')}</div>
    <div class="charts" style="margin-bottom:0">
      <div class="chart"><div class="muted" style="font-size:12px;margin-bottom:4px">Carga por ${per==='d'?'día':per==='w'?'semana':'mes'} (UA)</div>${barChart(B.map(b=>({label:b.label,value:b.load,cur:b.cur,tip:`${b.long}: ${fmtN(b.load)} UA · ${b.n} sesiones · ${fmtN(b.min)} min`})),150)}</div>
      <div><div class="muted" style="font-size:12px;margin-bottom:8px">¿A qué frecuencia cardiaca entrenó? · ${esc(c.long)}</div>
        ${zt?`<div class="zdist">${c.zones.map((m,i)=>`<div class="zr"><span><b>Z${i+1}</b> ${k?`${k.z[i].lo}–${k.z[i].hi}`:ZNAME[i]}</span><span class="zb"><i style="width:${Math.round(m/zt*100)}%;background:${ZC[i]}"></i></span><span style="text-align:right">${fmtN(m)} min</span></div>`).join('')}</div>`:`<div class="muted" style="font-size:12px">Sin datos de pulsaciones en este periodo. ${role==='athlete'?'Al terminar un entrenamiento toca la zona en la que estuviste.':'El atleta los registra al terminar cada entrenamiento.'}</div>`}
        ${c.meals?`<div class="muted" style="font-size:12px;margin:12px 0 4px">Alimentación: ${c.mealOk} según el plan · ${c.mealVar} con cambios · ${c.mealSkip} no hechas</div>`:''}
      </div>
    </div></div>`;
}
/* tooltip de gráficas */
const tipEl=document.createElement('div');tipEl.className='ctip';document.body.appendChild(tipEl);
document.addEventListener('mouseover',e=>{const g=e.target.closest&&e.target.closest('[data-tip]');if(!g){tipEl.style.display='none';return}tipEl.textContent=g.getAttribute('data-tip');tipEl.style.display='block'});
document.addEventListener('mousemove',e=>{if(tipEl.style.display==='block'){tipEl.style.left=Math.min(e.clientX+12,innerWidth-260)+'px';tipEl.style.top=(e.clientY+14)+'px'}});

/* ========================================================= */
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('videoRoot').innerHTML)closeVideo();else closeModal()}});
boot();
